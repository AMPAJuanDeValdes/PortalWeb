<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#16233A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AMPA">
<title>Cabalgata · AMPA Juan de Valdés</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/styles.css">
<style>
  .wrap{ max-width:960px; }
  h2.sec{ font-family:var(--font-title); font-weight:800; font-size:28px; margin:36px 0 14px; }
  .plaza{ background:#fff; border:1px solid var(--line); border-radius:var(--radius-card); padding:20px 22px; margin-bottom:14px; }
  .plaza.pendiente{ border:2px solid var(--eventos); }
  .plaza h3{ margin:0 0 4px; font-size:21px; }
  .plaza .quien{ margin:0; color:#3B4A60; }
  .plaza .estado{ margin:12px 0 0; font-size:18px; }
  .plaza .estado b{ font-family:var(--font-title); }
  .plaza .botones{ display:flex; gap:12px; flex-wrap:wrap; margin-top:14px; }
  .suplente-num{ white-space:nowrap; font-family:var(--font-title); font-weight:800; font-size:44px; line-height:1; color:var(--eventos); margin-right:12px; }
  .suplente{ display:flex; align-items:center; margin-top:12px; }
  .fotos{ display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:14px; }
  .fotos a{ display:flex; align-items:center; justify-content:center; height:260px; background:#fff; border:1px solid var(--line); border-radius:var(--radius-card); padding:12px; }
  .fotos img{ max-width:100%; max-height:100%; object-fit:contain; border-radius:8px; }
  .precio{ font-size:19px; margin:14px 0; }
  .pago{ background:#fff; border:1px solid var(--line); border-radius:var(--radius-card); padding:18px 20px; margin-top:12px; }
  .pago h3{ margin:0 0 8px; font-size:19px; }
  .elige-tit{ font-weight:700; margin:12px 0 6px; }
  .elige-tit .guia{ font-weight:400; margin-left:8px; }
  .colores{ display:grid; gap:16px; }
  .color-caja{ background:#fff; border:1px solid var(--line); border-radius:var(--radius-card); padding:16px 18px; }
  .color-caja h3{ display:flex; align-items:center; gap:10px; margin:0 0 10px; font-size:20px; }
  .color-caja .fotos{ grid-template-columns:repeat(3, 1fr); }
  .color-caja .fotos a{ height:180px; }
  .tallas-color{ margin:10px 0 0; }
  @media (max-width:520px){ .color-caja .fotos a{ height:120px; padding:6px; } }
  .guia-tallas{ display:block; margin:14px 0; max-width:520px; } .guia-tallas img{ width:100%; border:1px solid var(--line); border-radius:12px; }
  .elige{ display:flex; gap:8px; flex-wrap:wrap; }
  .opcion{ display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:8px 16px; border:2px solid var(--line); border-radius:999px; background:#fff; font:inherit; font-size:17px; color:var(--ink); cursor:pointer; }
  .opcion.sel{ border-color:var(--ink); background:var(--ink); color:#fff; font-weight:700; }
  .opcion:focus-visible{ outline:3px solid #2F6FB2; outline-offset:2px; }
  .muestra{ width:18px; height:18px; border-radius:50%; border:1px solid rgba(0,0,0,.25); }
  .pago .datos-pago{ margin-top:16px; }
  .instrucciones{ background:#fff; border:1px solid var(--line); border-radius:var(--radius-card); padding:20px 22px; white-space:pre-line; font-size:18px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="cab-servicio cs-eventos"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z"/></svg><div><nav class="miga" aria-label="Estás en"><a href="dashboard.html">Inicio</a><span aria-hidden="true">›</span><a href="eventos.html">Eventos</a><span aria-hidden="true">›</span><span id="miga">Cabalgata</span></nav><h1 id="titulo">Cabalgata</h1><p id="subtitulo">Aquí confirmáis si va cada uno que ha salido en el sorteo y tenéis todo lo que hace falta para el día.</p></div></header>
  <div id="contenido"><p class="empty-hint">Cargando...</p></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared/supabaseClient.js"></script>
<script src="shared/nav.js"></script>
<script src="shared/datos-ampa.js"></script>
<script>
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const NOMBRE_PUESTO = { responsable: 'Responsable', baltasar: 'Rey Baltasar', gaspar: 'Rey Gaspar', melchor: 'Rey Melchor', paje: 'Paje Real' };
const fechaLarga = (f) => new Date(f).toLocaleString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }).replace(',', '');
const euros = (n) => Number(n).toLocaleString('es-ES', { style: 'currency', currency: 'EUR' });
const eventoId = new URLSearchParams(location.search).get('evento');
// La Junta puede ver la página como la ve una familia (?familia=<socio>): solo mirar
let VISTA_FAMILIA = new URLSearchParams(location.search).get('familia');
// Muestra de color en los botones (si la Junta pone otro color, sale gris)
const COLOR_MUESTRA = { verde: '#2E9E4F', azul: '#2563C9', rojo: '#D23A32', amarillo: '#F2C230', morado: '#7B4BB7', blanco: '#fff', negro: '#222', dorado: '#C9A227', plateado: '#B8BEC6' };
let ctxGlobal = null, EV = null, VISTA_NOMBRE = '';

// Lo que pone cada plaza: confirmar, confirmada, suplente o sin plaza
// Cada plaza con su nombre (en una familia puede salir uno y otro no):
// quien = «Leo López» o «Ana López»; como = '' o ' como Paje Real'
function estadoPlaza(x, plazo, tieneLaPlaza, quien, como) {
  const q = esc(quien);
  if (tieneLaPlaza) {
    if (x.asistencia === 'si') return { clase: '', html: `<p class="estado"><b>Confirmado: ${q} va${esc(como)}.</b></p>`, botones: [['no', 'btn-outline', `${q} ya no puede ir`]] };
    return { clase: 'pendiente', html: `<p class="estado"><b>¡${q} ha salido sorteado/a${esc(como)}!</b> Confirmad si va antes del <b>${esc(fechaLarga(plazo))}</b>. Si no, la plaza pasa al primer suplente.</p>`,
      botones: [['si', 'btn-primary', `Sí, ${q} va`], ['no', 'btn-outline', `${q} no puede ir`]] };
  }
  if (x.asistencia === 'no' && x.suplente) return { clase: '', html: `<div class="suplente"><span class="suplente-num">${x.suplente}.º</span><span>Dijisteis que ${q} no podía ir${esc(como)}: su plaza pasó a otra persona y ahora es el ${x.suplente}.º suplente. Si queda libre una plaza, os avisamos por email y en el móvil.</span></div>`, botones: [] };
  if (x.asistencia === 'no') return { clase: '', html: `<p class="estado">Dijisteis que ${q} no podía ir: la plaza ha pasado a otra persona.</p>`, botones: [] };
  if (x.asistencia === 'caducada') return { clase: '', html: `<p class="estado">No confirmasteis a tiempo si ${q} iba: la plaza ha pasado a otra persona.</p>`, botones: [] };
  if (x.suplente) return { clase: '', html: `<div class="suplente"><span class="suplente-num">${x.suplente}.º</span><span>${q} es el ${x.suplente}.º suplente${esc(como)}. Si queda libre una plaza, os avisamos por email y en el móvil.</span></div>`, botones: [] };
  return { clase: '', html: `<p class="estado">${q} no ha salido en el sorteo${esc(como)}.</p>`, botones: [] };
}

async function responder(datos, va, boton) {
  if (!va && !confirm(`¿Seguro que ${datos.quien} no puede ir? Su plaza pasará al primer suplente y ${datos.quien} quedará el último de la lista de suplentes. No se puede deshacer.`)) return;
  boton.disabled = true;
  const msg = boton.closest('.plaza').querySelector('.msg-error');
  const { data: { session } } = await sb.auth.getSession();
  const r = await fetch('/.netlify/functions/cabalgata-responder', {
    method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token },
    body: JSON.stringify({ eventoId, va, grupo: datos.grupo, postulacion: datos.postulacion })
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { msg.textContent = j.error || 'No se pudo guardar.'; msg.hidden = false; boton.disabled = false; return; }
  pintar();
}

// Sube el justificante del vestuario. El mensaje va siempre en el mismo
// párrafo (.msg-subida), así se puede volver a intentar sin recargar.
async function subirJustificante(insc, importe, input, msg, boton) {
  const avisar = (texto, error) => { msg.textContent = texto; msg.classList.toggle('msg-error', !!error); msg.classList.toggle('ayuda', !error); msg.hidden = false; };
  const file = input.files[0];
  if (!file) { avisar('Elige el justificante de la transferencia.', true); return; }
  boton.disabled = true;
  avisar('Subiendo...');
  try {
    const path = `${ctxGlobal.socio.id}/disfraz-${Date.now()}-${file.name.replace(/[^a-zA-Z0-9.\-_]/g, '_')}`;
    const { error: upErr } = await sb.storage.from('comprobantes').upload(path, file);
    if (upErr) throw upErr;
    const { error } = await sb.from('comprobantes_pago').insert({
      tipo: 'disfraz_evento', evento_inscripcion_id: insc, socio_id: ctxGlobal.socio.id, archivo_url: path, importe });
    if (error) throw error;
  } catch (e) {
    avisar('No se pudo subir: ' + (e.message || e) + '. Vuelve a intentarlo y, si sigue sin funcionar, escribe a la Junta.', true);
    boton.disabled = false;
    return;
  }
  pintar();
}

async function pintar() {
  const cont = document.getElementById('contenido');
  const [{ data: ev }, { data: est, error }] = await Promise.all([
    sb.from('eventos').select('id, titulo, fecha, gestion_confirmar_hasta, disfraz_precio, disfraz_incluye, disfraz_fotos, disfraz_tallas, disfraz_colores, disfraz_guia_tallas, disfraz_config, gestion_instrucciones').eq('id', eventoId).maybeSingle(),
    VISTA_FAMILIA ? sb.rpc('cabalgata_estado_familia', { p_evento: eventoId, p_socio: VISTA_FAMILIA }) : sb.rpc('cabalgata_mi_estado', { p_evento: eventoId })
  ]);
  if (!ev) { cont.innerHTML = '<p class="msg-error">No se encuentra el evento.</p>'; return; }
  EV = ev;
  document.title = ev.titulo + ' · AMPA Juan de Valdés';
  document.getElementById('titulo').textContent = ev.titulo;
  document.getElementById('miga').textContent = ev.titulo;
  if (error) { cont.innerHTML = `<p class="msg-error">No se pudo cargar: ${esc(error.message)}</p>`; return; }
  if (VISTA_FAMILIA && !est) { cont.innerHTML = '<p class="msg-error">Solo la cuenta principal del AMPA puede ver la página como la ve una familia.</p>'; return; }
  const parejas = (est.parejas || []).filter(p => p.personas.some(x => x.tipo === 'alumno'));
  const puestos = est.puestos || [];
  if (!parejas.length && !puestos.length) {
    cont.innerHTML = '<p class="empty-hint">Esta página es para las familias que se apuntaron a la Cabalgata.</p>';
    return;
  }
  if (!ev.gestion_confirmar_hasta) {
    cont.innerHTML = '<p class="empty-hint">Todavía no se puede confirmar la plaza. Os avisaremos por email y en el móvil.</p>';
    return;
  }

  let html = '<h2 class="sec">Quién ha salido de vuestra familia</h2>';
  const tarjetas = [];
  for (const p of parejas) {
    const al = p.personas.filter(x => x.tipo === 'alumno');
    const ad = p.personas.filter(x => x.tipo !== 'alumno');
    const tiene = al.every(x => x.estado === 'ganador');
    const e = estadoPlaza({ ...al[0], suplente: p.suplente }, al[0].confirmar_hasta || ev.gestion_confirmar_hasta, tiene, al.map(x => x.nombre).join(' y '), '');
    tarjetas.push({ e, datos: { grupo: p.grupo }, quien: al.map(x => x.nombre).join(' y ') });
    html += `<div class="plaza ${e.clase}" data-t="${tarjetas.length - 1}"><h3>${al.map(x => esc(x.nombre)).join(' y ')}</h3>
      ${ad.length ? `<p class="quien">Con ${ad.map(x => esc(x.nombre)).join(' y ')}</p>` : ''}${e.html}
      ${e.botones.length ? `<div class="botones">${e.botones.map(([v, c, t]) => `<button type="button" class="btn ${c}" data-va="${v}">${t}</button>`).join('')}</div>` : ''}
      <p class="msg-error" hidden></p></div>`;
  }
  for (const p of puestos) {
    const e = estadoPlaza(p, p.confirmar_hasta || ev.gestion_confirmar_hasta, p.estado === 'elegido', p.nombre, ' como ' + (NOMBRE_PUESTO[p.puesto] || p.puesto));
    tarjetas.push({ e, datos: { postulacion: p.id }, quien: p.nombre });
    html += `<div class="plaza ${e.clase}" data-t="${tarjetas.length - 1}"><h3>${esc(NOMBRE_PUESTO[p.puesto] || p.puesto)}</h3><p class="quien">${esc(p.nombre)}</p>${e.html}
      ${e.botones.length ? `<div class="botones">${e.botones.map(([v, c, t]) => `<button type="button" class="btn ${c}" data-va="${v}">${t}</button>`).join('')}</div>` : ''}
      <p class="msg-error" hidden></p></div>`;
  }

  // Vestuario: lo ven y lo pagan las familias de los alumnos y alumnas que han salido.
  // Cada color tiene sus fotos y sus tallas; el precio depende de la talla.
  const conDisfraz = parejas.flatMap(p => p.personas).filter(x => x.tipo === 'alumno' && x.estado === 'ganador');
  if (conDisfraz.length && ev.disfraz_precio) {
    const cfg = ev.disfraz_config || {};
    const precioDe = (t) => (cfg.precios && cfg.precios[t] != null) ? cfg.precios[t] : ev.disfraz_precio;
    const tallasDe = (c) => (cfg.colores && cfg.colores[c] && Array.isArray(cfg.colores[c].tallas)) ? (ev.disfraz_tallas || []).filter(t => cfg.colores[c].tallas.includes(t)) : (ev.disfraz_tallas || []);
    const fotosDe = (c) => (cfg.colores && cfg.colores[c] && cfg.colores[c].fotos) || [];
    const muestra = (c) => `<span class="muestra" style="background:${COLOR_MUESTRA[c.toLowerCase()] || '#ccc'}"></span>`;
    // Al pulsar una foto se abre la guía de tallas (si no hay guía, la foto en grande)
    const guiasDe = (c) => (cfg.colores && cfg.colores[c] && cfg.colores[c].guias) || [];
    const guiaDe = (c, f) => guiasDe(c)[f] || ev.disfraz_guia_tallas || null;
    const hayGuia = (ev.disfraz_colores || []).some(c => fotosDe(c).some((u, f) => guiaDe(c, f)));
    html += `<h2 class="sec">Vestuario</h2>
      <p class="precio"><b>Es obligatorio adquirir el vestuario para participar en la Cabalgata.</b></p>
      <p class="precio">${ev.disfraz_incluye ? `Incluye: ${esc(ev.disfraz_incluye)}. ` : ''}El precio depende de la talla. Pagadlo por transferencia y subid el justificante para que podamos comprarlo.${hayGuia ? ' Pulsad una foto para ver su guía de tallas.' : ''}</p>
      <div class="colores">${(ev.disfraz_colores || []).map(c => `<div class="color-caja"><h3>${muestra(c)}${esc(c)}</h3>
        ${fotosDe(c).length ? `<div class="fotos">${fotosDe(c).map((u, f) => `<a href="${esc(guiaDe(c, f) || u)}" target="_blank" rel="noopener" aria-label="${guiaDe(c, f) ? 'Ver la guía de tallas' : 'Ver la foto en grande'}"><img src="${esc(u)}" alt="Vestuario ${esc(c)}" loading="lazy"></a>`).join('')}</div>` : ''}
        <p class="tallas-color"><b>Tallas:</b> ${tallasDe(c).map(t => `${esc(t)} (${euros(precioDe(t))})`).join(', ') || 'ninguna'}</p></div>`).join('')}</div>`;
    for (const x of conDisfraz) {
      const pago = x.pago;
      const d = x.disfraz || {};
      const tallas = d.color ? tallasDe(d.color) : [];
      const listo = d.color && d.talla && tallas.includes(d.talla);
      html += `<div class="pago" data-insc="${x.id}"><h3>Vestuario de ${esc(x.nombre)}</h3>
        <p class="elige-tit">Color</p><div class="elige" role="group" aria-label="Color de ${esc(x.nombre)}">${(ev.disfraz_colores || []).map(c => `<button type="button" class="opcion${d.color === c ? ' sel' : ''}" aria-pressed="${d.color === c}" data-color="${esc(c)}">${muestra(c)}${esc(c)}</button>`).join('')}</div>
        <p class="elige-tit">Talla${(() => { if (!d.color) return ''; const gs = [...new Set(fotosDe(d.color).map((u, f) => guiaDe(d.color, f)).filter(Boolean))]; if (!gs.length && ev.disfraz_guia_tallas) gs.push(ev.disfraz_guia_tallas); return gs.map((g, k) => ` <a class="guia" href="${esc(g)}" target="_blank" rel="noopener">Ver la guía de tallas${gs.length > 1 ? ' ' + (k + 1) : ''}</a>`).join(''); })()}</p>
        ${d.color ? `<div class="elige" role="group" aria-label="Talla de ${esc(x.nombre)}">${tallas.map(t => `<button type="button" class="opcion${d.talla === t ? ' sel' : ''}" aria-pressed="${d.talla === t}" data-talla="${esc(t)}">${esc(t)} · ${euros(precioDe(t))}</button>`).join('')}</div>` : '<p class="ayuda">Elegid primero el color.</p>'}
        <p class="msg-error elige-error" hidden></p>` + (pago
        ? `<p class="estado">${pago.verificado ? '<b>Pagado.</b> La Junta ha comprobado el pago.' : '<b>Justificante enviado.</b> La Junta lo revisará.'}</p>`
        : !listo ? '<p class="ayuda" style="margin-top:14px;">Cuando elijáis el color y la talla, aquí saldrán el importe y los datos para pagar.</p>'
        : `<div class="datos-pago">
            <div><span>Importe</span><b>${euros(precioDe(d.talla))}</b></div>
            <div><span>IBAN</span><b class="iban">${AMPA_IBAN}</b></div>
            <div><span>Titular</span><b>${esc(AMPA_TITULAR_CUENTA)}</b></div>
            <div><span>Concepto</span><b>Vestuario ${esc(ev.titulo)} - ${esc(x.nombre)}</b></div></div>
          <div class="field" style="margin-top:12px;"><label>Justificante de la transferencia</label><input type="file" class="justif" accept="image/*,.pdf"></div>
          <button type="button" class="btn btn-primary subir" data-insc="${x.id}" data-importe="${precioDe(d.talla)}">Enviar justificante</button><p class="msg-subida" hidden></p>`) + '</div>';
    }
  }
  const algunaPlaza = parejas.some(p => p.personas.some(x => x.estado === 'ganador')) || puestos.some(p => p.estado === 'elegido');
  if (algunaPlaza && ev.gestion_instrucciones) html += `<h2 class="sec">Para el día</h2><div class="instrucciones">${esc(ev.gestion_instrucciones)}</div>`;

  if (VISTA_FAMILIA) html = `<p class="aviso" style="margin-top:20px;"><b>Vista previa:</b> así ve esta página la familia${VISTA_NOMBRE ? ' ' + esc(VISTA_NOMBRE) : ''}. Desde aquí no se puede confirmar ni cambiar nada. <a href="admin-cabalgata.html?evento=${esc(eventoId)}">Volver a la gestión</a></p>` + html;
  cont.innerHTML = html;
  if (VISTA_FAMILIA) cont.querySelectorAll('button, input').forEach(el => { el.disabled = true; });
  cont.querySelectorAll('.plaza [data-va]').forEach(b => b.addEventListener('click', () => {
    const t = tarjetas[b.closest('.plaza').dataset.t];
    responder({ ...t.datos, quien: t.quien }, b.dataset.va === 'si', b);
  }));
  // Talla y color: se guardan con un clic
  cont.querySelectorAll('.elige .opcion').forEach(b => b.addEventListener('click', async () => {
    const caja = b.closest('.pago'), grupo = b.closest('.elige'), err = caja.querySelector('.elige-error');
    const antes = grupo.querySelector('.sel');
    grupo.querySelectorAll('.opcion').forEach(o => { o.classList.toggle('sel', o === b); o.setAttribute('aria-pressed', o === b); });
    const { error } = await sb.rpc('cabalgata_elegir_disfraz', { p_inscripcion: caja.dataset.insc, p_talla: b.dataset.talla || null, p_color: b.dataset.color || null });
    err.hidden = !error;
    if (error) {
      err.textContent = 'No se pudo guardar: ' + error.message;
      grupo.querySelectorAll('.opcion').forEach(o => { o.classList.toggle('sel', o === antes); o.setAttribute('aria-pressed', o === antes); });
      return;
    }
    pintar();   // las tallas dependen del color y el importe de la talla
  }));
  cont.querySelectorAll('.subir').forEach(b => b.addEventListener('click', () => {
    const caja = b.closest('.pago');
    subirJustificante(b.dataset.insc, Number(b.dataset.importe), caja.querySelector('.justif'), caja.querySelector('.msg-subida'), b);
  }));
}

(async () => {
  const ctx = await requireAuth();
  if (!ctx) return;
  ctxGlobal = ctx;
  if (VISTA_FAMILIA && (!ctx.adulto || ctx.adulto.role !== 'admin')) VISTA_FAMILIA = null;   // solo la Junta
  if (VISTA_FAMILIA) {
    const { data: n } = await sb.from('socios').select('numero_socio_completo').eq('id', VISTA_FAMILIA).maybeSingle();
    VISTA_NOMBRE = n ? 'con socio nº ' + numeroSocioBonito(n.numero_socio_completo) : '';
  }
  renderNav('eventos', ctx);
  if (!eventoId) { document.getElementById('contenido').innerHTML = '<p class="msg-error">Falta el evento.</p>'; return; }
  pintar();
})();
</script>
<script src="shared/sonido.js"></script>
<script src="shared/vida.js"></script>
<script src="shared/visitas.js" defer></script>
</body>
</html>
