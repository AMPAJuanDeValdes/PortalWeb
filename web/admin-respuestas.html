<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#16233A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AMPA">
<title>Respuestas · Admin AMPA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/styles.css">
<style>
  .panel{ display:none; } .panel.active{ display:block; }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Administración</div>
  <h1>Respuestas y listados</h1>

  <div class="tabs">
    <button class="tab-btn active" data-tab="prestamo">Banco de Libros</button>
    <button class="tab-btn" data-tab="eventos">Eventos</button>
    <button class="tab-btn" data-tab="alumnos">Alumnos (matrícula)</button>
    <button class="tab-btn" data-tab="datos">Datos sin confirmar</button>
  </div>

  <div class="panel active" id="panel-prestamo"><div class="card" id="wrapPrestamo"><p class="loading">Cargando...</p></div></div>

  <div class="panel" id="panel-eventos">
    <div class="card">
      <select id="eventoSelect"></select>
      <div id="eventoInscritosWrap"></div>
    </div>
  </div>

  <div class="panel" id="panel-alumnos"><div class="card" id="wrapAlumnos"><p class="loading">Cargando...</p></div></div>

  <div class="panel" id="panel-datos"><div class="card" id="wrapDatos"><p class="loading">Cargando...</p></div></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared/supabaseClient.js"></script>
<script src="shared/nav.js"></script>
<script src="shared/csv.js"></script>
<script src="shared/helpers.js"></script>
<script>
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});

async function cargarPrestamo() {
  const wrap = document.getElementById('wrapPrestamo');
  const { data, error } = await sb
    .from('prestamo_items')
    .select('tipo, socio_id, created_at, libros_catalogo(titulo), alumnos(nombre, apellidos, curso, etapa)')
    .order('created_at', { ascending: false });

  if (error) { wrap.innerHTML = '<p class="msg-error">No se pudo cargar: ' + String(error.message).replace(/[<&]/g, c => c === '<' ? '&lt;' : '&amp;') + '</p>'; return; }
  if (!data || data.length === 0) { wrap.innerHTML = '<p class="empty-hint">Sin solicitudes todavía.</p>'; return; }

  const resumen = await getResumenSocios(data.map(d => d.socio_id));

  wrap.innerHTML = '<table><thead><tr><th>Tipo</th><th>Libro</th><th>Curso</th><th>Alumno/a</th><th>Familia</th></tr></thead><tbody>' +
    data.map(d => '<tr>' +
      '<td>' + (d.tipo === 'donacion' ? 'Donación' : 'Solicitud') + '</td>' +
      '<td>' + (d.libros_catalogo ? d.libros_catalogo.titulo : '') + '</td>' +
      '<td>' + (d.alumnos ? d.alumnos.curso + ' ' + d.alumnos.etapa : '') + '</td>' +
      '<td>' + (d.alumnos ? d.alumnos.nombre + ' ' + d.alumnos.apellidos : '') + '</td>' +
      '<td>' + (resumen[d.socio_id] ? resumen[d.socio_id].nombre : '') + ' (' + (resumen[d.socio_id] ? resumen[d.socio_id].numero_socio : '') + ')</td>' +
    '</tr>').join('') + '</tbody></table>' +
    '<button class="btn btn-outline" id="descargarPrestamoBtn" style="margin-top:14px;">Descargar CSV</button>';

  document.getElementById('descargarPrestamoBtn').addEventListener('click', () => {
    descargarCSV(data.map(d => ({
      tipo: d.tipo, libro: d.libros_catalogo ? d.libros_catalogo.titulo : '',
      curso: d.alumnos ? d.alumnos.curso + ' ' + d.alumnos.etapa : '',
      alumno: d.alumnos ? d.alumnos.nombre + ' ' + d.alumnos.apellidos : '',
      familia: resumen[d.socio_id] ? resumen[d.socio_id].nombre : '',
      numero_socio: resumen[d.socio_id] ? resumen[d.socio_id].numero_socio : ''
    })), 'prestamo-libros.csv');
  });
}

async function cargarEventosSelect() {
  const select = document.getElementById('eventoSelect');
  const { data } = await sb.from('eventos').select('id, titulo, fecha, fecha_fin').order('fecha', { ascending: false });
  if (!data || data.length === 0) { select.innerHTML = '<option value="">No hay eventos</option>'; return; }
  select.innerHTML = data.map(e => '<option value="' + e.id + '">' + opcionEvento(e) + '</option>').join('');
  select.addEventListener('change', () => cargarInscritosDe(select.value, (data.find(e => e.id === select.value) || {}).titulo));
  cargarInscritosDe(select.value, data[0].titulo);
}

async function cargarInscritosDe(eventoId, titulo) {
  const wrap = document.getElementById('eventoInscritosWrap');
  if (!eventoId) { wrap.innerHTML = ''; return; }
  wrap.innerHTML = '<p class="loading">Cargando...</p>';

  const { data, error } = await sb
    .from('evento_inscripciones')
    .select('tipo_miembro, socio_id, nombre_invitado, nombre_contacto, email_contacto, es_voluntario, adultos!adulto_id(nombre, apellidos), alumnos(nombre, apellidos, curso, etapa)')
    .eq('evento_id', eventoId);

  if (error) { wrap.innerHTML = '<p class="msg-error">No se pudo cargar: ' + String(error.message).replace(/[<&]/g, c => c === '<' ? '&lt;' : '&amp;') + '</p>'; return; }
  if (!data || data.length === 0) { wrap.innerHTML = '<p class="empty-hint">Nadie inscrito todavía.</p>'; return; }

  const resumen = await getResumenSocios(data.filter(d => d.socio_id).map(d => d.socio_id));

  const filaDatos = (i) => {
    if (i.tipo_miembro === 'adulto') return { nombre: i.adultos ? i.adultos.nombre + ' ' + i.adultos.apellidos : '', tipo: 'Adulto' + (i.es_voluntario ? ' (voluntario)' : ''), familia: resumen[i.socio_id] ? resumen[i.socio_id].nombre : '' };
    if (i.tipo_miembro === 'alumno') return { nombre: i.alumnos ? i.alumnos.nombre + ' ' + i.alumnos.apellidos + ' (' + i.alumnos.curso + ' ' + i.alumnos.etapa + ')' : '', tipo: 'Alumno/a', familia: resumen[i.socio_id] ? resumen[i.socio_id].nombre : '' };
    if (i.tipo_miembro === 'invitado') return { nombre: i.nombre_invitado || '', tipo: 'Invitado', familia: resumen[i.socio_id] ? resumen[i.socio_id].nombre : '' };
    return { nombre: i.nombre_contacto || '', tipo: 'Público (' + (i.email_contacto || '') + ')', familia: '' };
  };

  wrap.innerHTML = '<p style="font-size:14px; margin:14px 0 10px;">' + data.length + ' inscripciones</p>' +
    '<table><thead><tr><th>Nombre</th><th>Tipo</th><th>Familia</th></tr></thead><tbody>' +
    data.map(i => { const f = filaDatos(i); return '<tr><td>' + f.nombre + '</td><td>' + f.tipo + '</td><td>' + f.familia + '</td></tr>'; }).join('') +
    '</tbody></table><button class="btn btn-outline" id="descargarEvBtn" style="margin-top:14px;">Descargar CSV</button>';

  document.getElementById('descargarEvBtn').addEventListener('click', () => {
    descargarCSV(data.map(i => { const f = filaDatos(i); return { nombre: f.nombre, tipo: f.tipo, familia: f.familia }; }),
      'inscritos-' + (titulo || 'evento').replace(/\s+/g, '-') + '.csv');
  });
}

// Alumnos y su matrícula. Filtro «Datos confirmados y sin verificar»: las
// familias que ya revisaron sus datos y cuyos alumnos falta cotejar con la
// matrícula del colegio (se exporta tal cual en CSV).
const ORDEN_ETAPA_AL = { Infantil: 1, Primaria: 2, ESO: 3, Bachillerato: 4 };
const escA = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let ALUMNOS = [];

async function cargarAlumnos() {
  const wrap = document.getElementById('wrapAlumnos');
  const [alumnos, socios, adultos] = await Promise.all([
    todasLasFilas(() => sb.from('alumnos').select('id, nombre, apellidos, fecha_nacimiento, etapa, curso, aula, verificado, socio_id')),
    todasLasFilas(() => sb.from('socios').select('id, numero_socio_completo, estado, datos_revisados_en')),
    todasLasFilas(() => sb.from('adultos').select('socio_id, nombre, apellidos, email, movil, dni_nie, created_at').order('created_at').order('id'))
  ]);
  const socio = Object.fromEntries(socios.map(x => [x.id, x]));
  const principal = {};
  adultos.forEach(x => { if (!principal[x.socio_id]) principal[x.socio_id] = x; });
  ALUMNOS = alumnos.map(a => {
    const s = socio[a.socio_id] || {}, ad = principal[a.socio_id] || {};
    return { ...a, numero: s.numero_socio_completo ? numeroSocioBonito(s.numero_socio_completo) : '', estado: s.estado || '',
      confirmados: s.datos_revisados_en || null, familia: [ad.nombre, ad.apellidos].filter(Boolean).join(' '), email: ad.email || '', movil: ad.movil || '', dni: ad.dni_nie || '' };
  }).sort((x, y) => (ORDEN_ETAPA_AL[x.etapa] || 9) - (ORDEN_ETAPA_AL[y.etapa] || 9)
    || (parseInt(x.curso, 10) || 99) - (parseInt(y.curso, 10) || 99) || String(x.aula || '').localeCompare(String(y.aula || ''))
    || (x.apellidos + x.nombre).localeCompare(y.apellidos + y.nombre, 'es'));

  wrap.innerHTML = `
    <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-bottom:12px;">
      <div class="field" style="margin:0; min-width:260px;"><label for="filtroMatricula">Mostrar</label>
        <select id="filtroMatricula">
          <option value="pendientes">Datos confirmados y matrícula sin verificar</option>
          <option value="sin">Matrícula sin verificar</option>
          <option value="ver">Matrícula verificada</option>
          <option value="">Todos</option>
        </select></div>
      <button class="btn btn-outline" id="descargarAlumnosBtn">Descargar CSV de esta lista</button>
    </div>
    <p id="contAlumnos" style="font-size:14px; color:var(--ink-soft); margin:0 0 6px;"></p>
    <div id="tablaAlumnos"></div>`;
  document.getElementById('filtroMatricula').addEventListener('change', pintarAlumnos);
  document.getElementById('descargarAlumnosBtn').addEventListener('click', () => {
    const lista = alumnosFiltrados();
    if (!lista.length) { alert('No hay alumnos en esta lista.'); return; }
    const filtro = document.getElementById('filtroMatricula').value;
    descargarCSV(lista.map(a => ({
      numero_socio: a.numero, familia: a.familia, email: a.email,
      dni_adulto_principal: a.dni, movil_adulto_principal: a.movil,
      nombre: a.nombre, apellidos: a.apellidos, fecha_nacimiento: a.fecha_nacimiento || '',
      etapa: a.etapa, curso: a.curso || '', aula: a.aula || '',
      datos_confirmados: a.confirmados ? new Date(a.confirmados).toLocaleDateString('es-ES') : 'no',
      matricula_verificada: a.verificado ? 'si' : 'no'
    })), filtro === 'pendientes' ? 'alumnos-datos-confirmados-sin-verificar.csv' : 'alumnos-matricula.csv');
  });
  pintarAlumnos();
}

function alumnosFiltrados() {
  const f = document.getElementById('filtroMatricula').value;
  return ALUMNOS.filter(a => f === 'pendientes' ? (a.confirmados && !a.verificado) : f === 'sin' ? !a.verificado : f === 'ver' ? a.verificado : true);
}

function pintarAlumnos() {
  const lista = alumnosFiltrados();
  document.getElementById('contAlumnos').textContent = `${lista.length} alumno${lista.length === 1 ? '' : 's'}`;
  const t = document.getElementById('tablaAlumnos');
  if (!lista.length) { t.innerHTML = '<p class="empty-hint">No hay alumnos en esta lista.</p>'; return; }
  t.innerHTML = '<div style="overflow-x:auto;"><table><thead><tr><th>Nombre</th><th>Curso</th><th>Aula</th><th>Familia</th><th>DNI adulto principal</th><th>Móvil adulto principal</th><th>Datos</th><th>Matrícula</th><th></th></tr></thead><tbody>' +
    lista.map(a => '<tr>' +
      `<td>${escA(a.nombre + ' ' + a.apellidos)}</td>` +
      `<td>${escA([a.curso, a.etapa].filter(Boolean).join(' '))}</td>` +
      `<td>${escA(a.aula || '')}</td>` +
      `<td>${a.numero ? `<span style="font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; color:var(--ink-soft);">${escA(a.numero)}</span> ` : ''}${escA(a.familia)}</td>` +
      `<td>${escA(a.dni)}</td>` +
      `<td>${escA(a.movil)}</td>` +
      `<td>${a.confirmados ? '<span class="badge badge-socio">Confirmados</span>' : '<span class="badge badge-admin">Sin confirmar</span>'}</td>` +
      `<td>${a.verificado ? '<span class="badge badge-socio">✓ Verificada</span>' : '<span class="badge badge-admin">Falta verificar</span>'}</td>` +
      `<td><button class="btn-danger-link toggleVerificadoBtn" data-id="${escA(a.id)}">${a.verificado ? 'Desmarcar' : 'Marcar verificada'}</button></td>` +
    '</tr>').join('') + '</tbody></table></div>';
  t.querySelectorAll('.toggleVerificadoBtn').forEach(btn => btn.addEventListener('click', async () => {
    const a = ALUMNOS.find(x => x.id === btn.dataset.id);
    btn.disabled = true;
    const { error } = await sb.from('alumnos').update({ verificado: !a.verificado }).eq('id', a.id);
    if (error) { alert('No se pudo guardar: ' + error.message); btn.disabled = false; return; }
    a.verificado = !a.verificado;
    pintarAlumnos();
  }));
}

/* ---- Familias activas sin los datos confirmados: por qué, para darles soporte ----
   familias_sin_confirmar() (migracion-confirmar-datos-intentos.sql): lo que les
   falta ahora, sus intentos de «Los datos de mi familia están bien» y su último
   acceso a la web. */
async function cargarDatosSinConfirmar() {
  const wrap = document.getElementById('wrapDatos');
  const { data, error } = await sb.rpc('familias_sin_confirmar');
  if (error) { wrap.innerHTML = '<p class="msg-error">No se pudo cargar: ' + escA(error.message) + '</p>'; return; }
  const fechaHora = (f) => new Date(f).toLocaleString('es-ES', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  const filas = (data || []).map(f => {
    const ad = (f.adultos || [])[0] || {};
    let motivo, puedeJunta = false;
    if (f.faltan) motivo = `<b>Le falta:</b> ${escA(f.faltan)}. Tienen que completarlo en Mis datos (o la Junta en su ficha de Socios).`;
    else if (!f.ultimo_acceso) motivo = 'No ha entrado nunca en la web.';
    else if (!f.ultimo_intento) { motivo = `Tiene todo completo${f.sin_alumnos ? ' (no tiene alumnos dados de alta)' : ''}, pero no ha pulsado «Los datos de mi familia están bien» en Mis datos.`; puedeJunta = true; }
    else { motivo = `Lo intentó, pero entonces le faltaban datos. Ahora tiene todo completo: solo tiene que volver a pulsar «Los datos de mi familia están bien».`; puedeJunta = true; }
    return { f, ad, motivo, puedeJunta };
  });
  wrap.innerHTML = `
    <p style="margin:0 0 10px; color:var(--ink-soft);">Familias activas que todavía no han confirmado sus datos: hasta que lo hagan no pueden apuntarse a eventos. El motivo se calcula con sus datos de ahora.</p>
    <div style="display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; margin:0 0 6px;">
      <p style="margin:0; font-size:14px; color:var(--ink-soft);">${filas.length} familia${filas.length === 1 ? '' : 's'}</p>
      ${filas.length ? '<a class="btn btn-outline" href="admin-email.html?para=sin_confirmar">Enviar un email a estas familias</a>' : ''}
    </div>
    ${filas.length ? `<div style="overflow-x:auto;"><table><thead><tr><th>Familia</th><th>Contacto</th><th>Por qué</th><th>Intentos fallidos</th><th>Último acceso</th><th></th></tr></thead><tbody>
    ${filas.map(({ f, ad, motivo, puedeJunta }) => `<tr>
      <td>${f.numero ? `<span style="font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; color:var(--ink-soft);">${escA(numeroSocioBonito(f.numero))}</span><br>` : ''}${escA([ad.nombre, ad.apellidos].filter(Boolean).join(' '))}</td>
      <td style="font-size:14px;">${escA(ad.email || '')}${ad.movil ? '<br>' + escA(ad.movil) : ''}</td>
      <td style="font-size:14px;">${motivo}${f.ultimo_error ? `<br><span style="color:var(--ink-soft);">Último error que vio: «${escA(f.ultimo_error)}» (${fechaHora(f.ultimo_intento)})</span>` : ''}</td>
      <td>${f.intentos_fallidos || 0}</td>
      <td style="font-size:14px;">${f.ultimo_acceso ? fechaHora(f.ultimo_acceso) : 'Nunca'}</td>
      <td>${puedeJunta ? `<button class="btn-danger-link confirmarJuntaBtn" style="color:var(--navy);" data-id="${escA(f.socio_id)}">Confirmar por la familia</button>` : ''}</td>
    </tr>`).join('')}</tbody></table></div>` : '<p class="empty-hint">Todas las familias activas tienen los datos confirmados.</p>'}
    <p class="msg-error datosMsg" hidden></p>`;
  wrap.querySelectorAll('.confirmarJuntaBtn').forEach(b => b.addEventListener('click', async () => {
    if (!confirm('¿Confirmar los datos de esta familia en su nombre? Hacedlo solo si los habéis revisado con ella. Después ya podrá apuntarse a los eventos.')) return;
    b.disabled = true;
    const m = wrap.querySelector('.datosMsg');
    const { data: fallo, error: err } = await sb.rpc('junta_confirmar_datos', { p_socio: b.dataset.id });
    if (err || fallo) { m.textContent = err ? err.message : fallo; m.hidden = false; b.disabled = false; return; }
    cargarDatosSinConfirmar();
  }));
}

(async () => {
  const ctx = await requireAdmin();
  if (!ctx) return;
  renderNav('admin-respuestas', ctx);
  // admin-respuestas.html#datos: abre directamente «Datos sin confirmar» (enlace del Resumen)
  if (location.hash === '#datos') document.querySelector('.tab-btn[data-tab="datos"]').click();
  cargarDatosSinConfirmar();
  await cargarPrestamo();
  await cargarEventosSelect();
  await cargarAlumnos();
})();
</script>
<script src="shared/sonido.js"></script>
<script src="shared/vida.js"></script>
<script src="shared/visitas.js" defer></script>
</body>
</html>
