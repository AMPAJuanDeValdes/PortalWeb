<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eventos (admin) · AMPA Juan de Valdés</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/styles.css">
<style>
  .evento-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding:14px 0; border-bottom:1px solid var(--line); }
  .evento-row:last-child{ border-bottom:none; }
  .evento-row-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .evento-row-actions button{ font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">AMPA · Administración</div>
  <h1>Eventos</h1>
  <p class="lede">Crea eventos y consulta quién se ha apuntado.</p>

  <div class="card">
    <p class="section-label">Nuevo evento</p>
    <form id="eventoForm">
      <div class="field">
        <label>Título</label>
        <input type="text" id="titulo" required>
      </div>
      <div class="field">
        <label>Descripción</label>
        <textarea id="descripcion"></textarea>
      </div>
      <div class="field">
        <label>Fecha y hora</label>
        <input type="datetime-local" id="fecha">
      </div>
      <div class="field">
        <label>Aforo máximo (opcional)</label>
        <input type="number" id="aforo" min="1">
      </div>
      <button type="submit" class="btn btn-primary">Crear evento</button>
      <p id="createMsg" class="msg-ok" style="display:none;"></p>
    </form>
  </div>

  <div class="card">
    <p class="section-label">Eventos existentes</p>
    <div id="eventosList"><p class="loading">Cargando...</p></div>
  </div>

  <div class="card" id="inscritosCard" style="display:none;">
    <p class="section-label" id="inscritosTitulo">Inscritos</p>
    <div id="inscritosList"></div>
  </div>

  <footer class="note"><b>AMPA Colegio Juan de Valdés</b> — panel de administración</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared/supabaseClient.js"></script>
<script src="shared/nav.js"></script>
<script src="shared/csv.js"></script>
<script src="shared/helpers.js"></script>
<script>
document.getElementById('eventoForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const titulo = document.getElementById('titulo').value.trim();
  const descripcion = document.getElementById('descripcion').value.trim();
  const fecha = document.getElementById('fecha').value;
  const aforo = document.getElementById('aforo').value;

  const { error } = await supabase.from('eventos').insert({
    titulo,
    descripcion,
    fecha: fecha ? new Date(fecha).toISOString() : null,
    aforo: aforo ? parseInt(aforo, 10) : null
  });

  const msg = document.getElementById('createMsg');
  msg.style.display = 'block';
  msg.className = error ? 'msg-error' : 'msg-ok';
  msg.textContent = error ? 'Error: ' + error.message : 'Evento creado ✓';
  if (!error) { e.target.reset(); cargarEventos(); }
});

async function cargarEventos() {
  const wrap = document.getElementById('eventosList');
  const { data, error } = await supabase.from('eventos').select('*').order('fecha', { ascending: true });
  if (error) { wrap.innerHTML = '<p class="msg-error">No se pudieron cargar los eventos.</p>'; return; }
  if (!data || data.length === 0) { wrap.innerHTML = '<p class="empty-hint">Aún no hay eventos creados.</p>'; return; }

  wrap.innerHTML = '';
  data.forEach(ev => {
    const row = document.createElement('div');
    row.className = 'evento-row';
    row.innerHTML = `
      <div>
        <div style="font-weight:600;">${ev.titulo} ${ev.activo ? '' : '<span class="badge badge-socio">Oculto</span>'}</div>
        <div style="font-size:12.5px; color:var(--ink-soft);">
          ${ev.fecha ? new Date(ev.fecha).toLocaleString('es-ES') : 'Sin fecha'} ${ev.aforo ? '· Aforo: ' + ev.aforo : ''}
        </div>
      </div>
    `;
    const actions = document.createElement('div');
    actions.className = 'evento-row-actions';

    const verBtn = document.createElement('button');
    verBtn.className = 'btn btn-outline';
    verBtn.textContent = 'Ver inscritos';
    verBtn.addEventListener('click', () => mostrarInscritos(ev));
    actions.appendChild(verBtn);

    const toggleBtn = document.createElement('button');
    toggleBtn.className = 'btn-danger-link';
    toggleBtn.textContent = ev.activo ? 'Ocultar' : 'Reactivar';
    toggleBtn.addEventListener('click', async () => {
      await supabase.from('eventos').update({ activo: !ev.activo }).eq('id', ev.id);
      cargarEventos();
    });
    actions.appendChild(toggleBtn);

    const delBtn = document.createElement('button');
    delBtn.className = 'btn-danger-link';
    delBtn.textContent = 'Borrar';
    delBtn.addEventListener('click', async () => {
      if (!confirm('¿Borrar este evento y todas sus inscripciones?')) return;
      await supabase.from('eventos').delete().eq('id', ev.id);
      cargarEventos();
    });
    actions.appendChild(delBtn);

    row.appendChild(actions);
    wrap.appendChild(row);
  });
}

async function mostrarInscritos(ev) {
  const card = document.getElementById('inscritosCard');
  const titulo = document.getElementById('inscritosTitulo');
  const list = document.getElementById('inscritosList');
  card.style.display = 'block';
  titulo.textContent = 'Inscritos en: ' + ev.titulo;
  list.innerHTML = '<p class="loading">Cargando...</p>';

  const { data, error } = await supabase
    .from('evento_inscripciones')
    .select('profile_id, num_asistentes, notas, created_at')
    .eq('evento_id', ev.id);

  if (error) { list.innerHTML = '<p class="msg-error">No se pudo cargar.</p>'; return; }
  if (!data || data.length === 0) { list.innerHTML = '<p class="empty-hint">Nadie se ha apuntado todavía.</p>'; return; }

  const resumen = await getResumenSocios(data.map(i => i.profile_id));
  const total = data.reduce((sum, i) => sum + i.num_asistentes, 0);

  list.innerHTML = `
    <p style="font-size:13.5px; margin-bottom:10px;">${data.length} familias · ${total} asistentes en total</p>
    <table>
      <thead><tr><th>Titular</th><th>Nº socio</th><th>Asistentes</th><th>Notas</th></tr></thead>
      <tbody>
        ${data.map(i => `
          <tr>
            <td>${resumen[i.profile_id]?.nombre || ''}</td>
            <td>${resumen[i.profile_id]?.numero_socio || ''}</td>
            <td>${i.num_asistentes}</td>
            <td>${i.notas || ''}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
    <button class="btn btn-outline" id="descargarInscritosBtn" style="margin-top:14px;">Descargar CSV</button>
  `;

  document.getElementById('descargarInscritosBtn').addEventListener('click', () => {
    descargarCSV(data.map(i => ({
      titular: resumen[i.profile_id]?.nombre || '',
      numero_socio: resumen[i.profile_id]?.numero_socio || '',
      asistentes: i.num_asistentes,
      notas: i.notas || ''
    })), 'inscritos-' + ev.titulo.replace(/\s+/g, '-') + '.csv');
  });
}

(async () => {
  const ctx = await requireAdmin();
  if (!ctx) return;
  renderNav('admin-eventos', ctx.profile);
  await cargarEventos();
})();
</script>
</body>
</html>
