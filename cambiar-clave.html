<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contraseña · AMPA Juan de Valdés</title>
<!-- Se guarda la URL tal y como llega ANTES de cargar Supabase, porque la
     librería borra el "#..." del enlace del correo al leerlo. Con eso
     sabemos si venimos de "recuperar contraseña" o de un enlace caducado. -->
<script>window.__hashInicial = window.location.hash || ''; window.__queryInicial = window.location.search || '';</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/styles.css">
<style>
  .center-wrap{ max-width:420px; margin:0 auto; padding:10px 20px 60px; }
  .card-links{ display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
  .card-links .btn{ flex:1; text-align:center; }
</style>
</head>
<body>
<header class="pub-head">
  <a href="index.html" class="pub-marca"><img src="assets/logo-ampa.png" alt=""><span><b>AMPA</b><small>Colegio Juan de Valdés</small></span></a>
  <img class="pub-colegio" src="assets/logo-colegio.png" alt="Colegio Juan de Valdés">
  <nav class="pub-links" id="navLinks">
    <a href="index.html">Página principal</a>
    <a href="login.html" class="pub-pill">Entrar como socio</a>
  </nav>
</header>

<div class="center-wrap">
  <div class="eyebrow" style="margin-top:22px;">Seguridad</div>
  <h1 id="titulo">Cargando...</h1>
  <p class="lede" id="lede"></p>

  <div class="card" id="formCard" style="display:none;">
    <form id="pwdForm">
      <div class="field">
        <label for="password">Nueva contraseña (mínimo 6 caracteres)</label>
        <input type="password" id="password" required minlength="6" autocomplete="new-password">
      </div>
      <div class="field">
        <label for="password2">Repite la contraseña</label>
        <input type="password" id="password2" required minlength="6" autocomplete="new-password">
      </div>
      <p id="errorMsg" class="msg-error" hidden></p>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Guardar y continuar</button>
    </form>
    <p id="cancelarWrap" style="display:none; text-align:center; margin-top:14px; font-size:14px;">
      <a href="mis-datos.html" style="color:var(--navy);">Cancelar y volver</a>
    </p>
  </div>

  <div class="card" id="avisoCard" style="display:none;">
    <p style="color:var(--ink-soft); font-size:14.5px;" id="avisoTexto"></p>
    <div class="card-links" id="avisoBotones"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared/supabaseClient.js"></script>
<script>
  const hashParams = new URLSearchParams((window.__hashInicial || '').replace(/^#/, ''));
  const queryParams = new URLSearchParams(window.__queryInicial || '');
  const enlaceConError = !!(hashParams.get('error') || hashParams.get('error_code') ||
                            queryParams.get('error') || queryParams.get('error_code'));
  const esRecuperacion = hashParams.get('type') === 'recovery' || queryParams.get('type') === 'recovery';

  let modo = null; // 'recuperacion' | 'forzado' | 'voluntario'

  function textos(titulo, lede) {
    document.getElementById('titulo').textContent = titulo;
    document.getElementById('lede').textContent = lede || '';
  }

  function mostrarAviso(titulo, texto, botones) {
    textos(titulo, '');
    document.getElementById('formCard').style.display = 'none';
    document.getElementById('avisoCard').style.display = 'block';
    document.getElementById('avisoTexto').innerHTML = texto;
    document.getElementById('avisoBotones').innerHTML = botones.map(b =>
      `<a href="${b.href}" class="btn ${b.primario ? 'btn-primary' : 'btn-outline'}">${b.texto}</a>`).join('');
  }

  const BOTONES_PUBLICOS = [
    { href: 'login.html', texto: 'Ir al acceso', primario: true },
    { href: 'index.html', texto: 'Página principal' }
  ];

  function mostrarFormulario() {
    document.getElementById('formCard').style.display = 'block';
  }

  (async () => {
    // 1. Enlace del correo ya usado o caducado (lo que pasaba al pulsar
    //    el botón del email por segunda vez)
    if (enlaceConError) {
      mostrarAviso('Enlace no válido o caducado',
        'Este enlace para restablecer la contraseña ya no es válido: solo se puede usar <b>una vez</b> y caduca pasado un tiempo. ' +
        'Si ya cambiaste la contraseña, entra con la nueva. Si no, vuelve a pedir otro enlace desde "¿Has olvidado tu contraseña?".',
        BOTONES_PUBLICOS);
      return;
    }

    const session = await getSession();

    // 2. Viene del correo de recuperación
    if (esRecuperacion) {
      if (!session) {
        mostrarAviso('Enlace no válido o caducado',
          'Este enlace ya no es válido. Vuelve a pedir otro desde "¿Has olvidado tu contraseña?" en la pantalla de acceso.',
          BOTONES_PUBLICOS);
        return;
      }
      // Solo una cuenta activa puede restablecer la contraseña
      const adulto = await getAdulto();
      const socio = adulto ? await getSocio(adulto.socio_id) : null;
      if (!socio || socio.estado !== 'activa') {
        await sb.auth.signOut();
        if (socio && (socio.estado === 'baja' || socio.estado === 'falta_pago')) {
          mostrarAviso('Tu cuenta no está activa',
            'Solo las cuentas activas pueden cambiar la contraseña. Tu cuenta está ' +
            (socio.estado === 'baja' ? '<b>dada de baja</b>' : '<b>pendiente del pago de la cuota</b>') +
            '. Puedes reactivarla enviándonos el comprobante de pago.',
            [{ href: 'reactivar-cuenta.html?motivo=' + socio.estado + '&email=' + encodeURIComponent(adulto.email || ''), texto: 'Reactivar mi cuenta', primario: true },
             { href: 'index.html', texto: 'Página principal' }]);
        } else {
          mostrarAviso('No se puede cambiar la contraseña',
            'Tu cuenta todavía no está activa. En cuanto el AMPA la active recibirás un correo.', BOTONES_PUBLICOS);
        }
        return;
      }
      modo = 'recuperacion';
      textos('Restablece tu contraseña', 'Escribe tu nueva contraseña para recuperar el acceso a tu cuenta.');
      mostrarFormulario();
      return;
    }

    // 3. Sin sesión y sin enlace: no hay nada que hacer aquí
    if (!session) { window.location.href = 'login.html'; return; }

    const adulto = await getAdulto();
    if (adulto && adulto.force_password_change) {
      // 4. Primer acceso (contraseña provisional del email)
      modo = 'forzado';
      textos('Elige una nueva contraseña', 'Es tu primer acceso: por seguridad, cambia la contraseña provisional que te enviamos por email.');
      document.getElementById('navLinks').innerHTML = '<a href="index.html">Página principal</a><a href="#" id="salirLink" class="pub-pill">Cerrar sesión</a>';
      document.getElementById('salirLink').addEventListener('click', (e) => { e.preventDefault(); signOut(); });
    } else {
      // 5. Cambio voluntario desde "Mis datos"
      modo = 'voluntario';
      textos('Cambiar mi contraseña', 'Escribe la contraseña nueva que quieres usar a partir de ahora.');
      document.getElementById('navLinks').innerHTML = '<a href="mis-datos.html">Mis datos</a><a href="dashboard.html" class="pub-pill">Mi perfil</a>';
      document.getElementById('cancelarWrap').style.display = 'block';
    }
    mostrarFormulario();
  })();

  const form = document.getElementById('pwdForm');
  const errorMsg = document.getElementById('errorMsg');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.hidden = true;
    const p1 = document.getElementById('password').value;
    const p2 = document.getElementById('password2').value;
    if (p1 !== p2) {
      errorMsg.textContent = 'Las dos contraseñas no coinciden.';
      errorMsg.hidden = false;
      return;
    }
    submitBtn.disabled = true;
    submitBtn.textContent = 'Guardando...';

    const { error: updError } = await sb.auth.updateUser({ password: p1 });
    if (updError) {
      const mismo = /different|same/i.test(updError.message || '');
      errorMsg.textContent = mismo
        ? 'La nueva contraseña tiene que ser distinta de la anterior.'
        : 'No se pudo actualizar la contraseña: ' + updError.message;
      errorMsg.hidden = false;
      submitBtn.disabled = false;
      submitBtn.textContent = 'Guardar y continuar';
      return;
    }

    const session = await getSession();
    await sb.from('adultos').update({ force_password_change: false }).eq('id', session.user.id);

    const adulto = await getAdulto();
    const socio = adulto ? await getSocio(adulto.socio_id) : null;
    if (socio && socio.estado === 'recien_creada') { window.location.href = 'estado-recien-creada.html'; return; }
    if (!socio || socio.estado !== 'activa') { await signOut(); return; }

    if (modo === 'voluntario') {
      mostrarAviso('Contraseña cambiada ✓', 'A partir de ahora usa la nueva contraseña para entrar.',
        [{ href: 'dashboard.html', texto: 'Volver a Inicio', primario: true }]);
      return;
    }
    window.location.href = socio.datos_revisados_en ? 'dashboard.html' : 'mis-datos.html';
  });
</script>
<script src="shared/sonido.js"></script>
<script src="shared/vida.js"></script>
</body>
</html>
