[build]
  publish = "web"
  functions = "netlify/functions"
  command = "npm install"

# El logo de la firma de los emails (y el de las circulares) va dentro del propio email
[functions]
  included_files = ["web/assets/logo-ampa-email.jpg", "web/assets/logo-ampa-circular.png"]

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404

# Mochila Jugona: cada 15 minutos quita de la lista a la familia que lleva
# más de 24 h sin aceptar su turno y se lo pasa a la siguiente
[functions."mochila-caducar"]
  schedule = "*/15 * * * *"

# Cabalgata: cada 30 minutos, quien no ha confirmado a tiempo pierde la plaza
# y entra el siguiente suplente
[functions."cabalgata-caducar"]
  schedule = "*/30 * * * *"

# Sorteos (menos la Cabalgata): cada 15 minutos, si ha quedado libre una plaza,
# entra el primer suplente y le llega un email
[functions."evento-suplentes"]
  schedule = "*/15 * * * *"

# Avisos en el móvil: el service worker se comprueba siempre (si no, las
# familias tardarían en recibir los cambios)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
