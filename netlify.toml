[build]
  publish = "web"
  functions = "netlify/functions"
  command = "npm install"

# El logo de la firma de los emails va dentro del propio email
[functions]
  included_files = ["web/assets/logo-ampa-email.jpg"]

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404

# Mochila Jugona: cada 15 minutos quita de la lista a la familia que lleva
# más de 24 h sin aceptar su turno y se lo pasa a la siguiente
[functions."mochila-caducar"]
  schedule = "*/15 * * * *"
