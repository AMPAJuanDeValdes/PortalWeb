<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eventos · AMPA Juan de Valdés</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/styles.css">
<style>
  /* Tarjeta de evento: cabecera de color según el tipo */
  .t-verde{ --t:#3F6E12; --t-bg:#E6F2D8; --t-fuerte:#5E9426; }
  .t-rosa{ --t:#B0185A; --t-bg:#FDE7F1; --t-fuerte:#D6246E; }
  .t-amarillo{ --t:#8A6400; --t-bg:#FFF3C4; --t-fuerte:#9A6E00; }
  .t-cielo{ --t:#006D9C; --t-bg:#DCF0FA; --t-fuerte:#0098D8; }
  .t-morado{ --t:#6B3FA0; --t-bg:#EFE7FA; --t-fuerte:#8A5CC2; }
  .evento-card{ margin-bottom:26px; padding:0 24px 22px; overflow:hidden; border:0; box-shadow:0 1px 0 var(--line), 0 0 0 1px var(--line); }
  .ev-cab{ margin:0 -24px 16px; padding:22px 24px; background:var(--t-bg); display:flex; gap:18px; align-items:flex-start; position:relative; }
  .ev-fecha{ flex:0 0 74px; background:var(--t-fuerte); color:#fff; border-radius:16px; text-align:center; padding:8px 4px; line-height:1.1; }
  .ev-fecha b{ display:block; font-family:var(--font-title); font-weight:800; font-size:34px; line-height:1; margin:2px 0; }
  .ev-fecha span{ font-size:14px; font-weight:700; text-transform:none; }
  .ev-tit{ flex:1 1 auto; min-width:0; padding-right:56px; }
  .ev-tit h2{ font-size:clamp(22px,3.4vw,28px); font-weight:800; margin:0 0 4px; }
  .ev-hora{ margin:0; color:var(--t); font-weight:700; }
  .ev-icono{ position:absolute; right:20px; top:18px; width:46px; height:46px; color:var(--t); opacity:.55; }
  .ev-fotos{ max-width:520px; margin:0 0 14px; }
  .ev-desc{ white-space:pre-line; margin:0 0 6px; font-size:17px; }
  .etiquetas{ display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 0; }
  .etiqueta{ display:inline-block; font-size:14px; font-weight:700; padding:3px 12px; border-radius:999px; background:#fff; color:var(--t); }
  .etiqueta.llena{ background:#FBE4E1; color:var(--red); }
  .avatar{ flex:0 0 36px; width:36px; height:36px; border-radius:50%; background:var(--t-bg); color:var(--t); font-weight:700; font-size:14px; display:inline-flex; align-items:center; justify-content:center; margin-right:10px; }
  .persona{ display:flex; align-items:center; min-width:0; }
  .filtros{ display:flex; gap:8px; flex-wrap:wrap; margin:0 0 22px; }
  .filtros button{ font:inherit; font-weight:700; font-size:15px; min-height:42px; padding:0 18px; border-radius:999px; border:1.5px solid #C9D3DF; background:#fff; color:var(--ink); cursor:pointer; }
  .filtros button[aria-pressed="true"]{ background:var(--ink); border-color:var(--ink); color:#fff; }
  @media (max-width:560px){
    .evento-card{ padding:0 16px 18px; }
    .ev-cab{ margin:0 -16px 14px; padding:18px 16px; gap:12px; }
    .ev-fecha{ flex-basis:62px; }
    .ev-fecha b{ font-size:28px; }
    .ev-icono{ display:none; }
    .ev-tit{ padding-right:0; }
  }
  .precios{ font-size:15px; color:var(--ink-soft); margin:8px 0 0; }
  .bloque{ margin-top:16px; padding:16px 18px; background:#F9FAFC; border-radius:18px; }
  .bloque > h3{ font-size:19px; margin:0 0 4px; display:flex; align-items:center; gap:10px; }
  .bloque > h3::before{ content:""; width:10px; height:10px; border-radius:50%; background:var(--t-fuerte); }
  .bloque > .ayuda{ color:var(--ink-soft); font-size:15px; margin:0 0 8px; }
  .miembro{ padding:10px 0; border-bottom:1px solid #E9EDF2; }
  .miembro:last-child{ border-bottom:none; }
  .miembro-fila{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .miembro-fila .nombre{ font-weight:700; }
  .miembro-fila .accion{ display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  .miembro-fila .detalle{ display:block; font-weight:400; font-size:14px; color:var(--ink-soft); }
  .mini-form{ background:#F9FAFC; border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-top:10px; display:grid; gap:12px; }
  .mini-form .radios{ display:flex; gap:18px; flex-wrap:wrap; }
  .mini-form .radios label{ font-weight:400; display:flex; gap:6px; align-items:center; margin:0; }
  .estado-ok{ color:var(--green); font-weight:700; font-size:15px; }
  .estado-no{ color:var(--red); font-weight:700; font-size:15px; }
  .estado-gris{ color:var(--ink-soft); font-size:15px; }
  .actividad{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px; margin-top:12px; }
  .actividad h4{ font-family:var(--font-title); font-size:17px; margin:0; }
  .falta-adulto{ background:#FFF3C4; border-radius:var(--radius); padding:12px 14px; margin-top:8px; }
  .check-acomp{ display:flex; align-items:center; gap:8px; font-weight:700; margin:0; cursor:pointer; }
  .check-acomp input{ width:20px; height:20px; }
  .bloque-premios{ background:var(--uniformes-bg); border-radius:var(--radius); padding:14px 16px; margin-top:12px; }
  .bloque-premios h3{ font-size:17px; margin:0 0 6px; }
  .premios{ margin:6px 0 0; padding-left:20px; }
  .premios li{ margin-bottom:4px; }
  .premios .ganador{ display:block; color:var(--green); font-weight:700; }
  .dos{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:560px){ .dos{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Actividades</div>
  <h1>Eventos</h1>
  <p class="lede">Los eventos en los que puede participar alguien de tu familia.</p>

  <div class="filtros" id="filtros" hidden>
    <button type="button" data-f="todos" aria-pressed="true">Todos</button>
    <button type="button" data-f="abierto" aria-pressed="false">Puedes apuntarte</button>
    <button type="button" data-f="apuntado" aria-pressed="false">Ya apuntados</button>
  </div>
  <p id="loadingMsg" class="loading">Cargando eventos...</p>
  <div id="eventosContainer"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared/supabaseClient.js"></script>
<script src="shared/datos-ampa.js"></script>
<script src="shared/carrusel.js"></script>
<script src="shared/documentoRellenable.js"></script>
<script src="shared/nav.js"></script>
<script>
let ctxGlobal = null;
let misAdultos = [];
let misAlumnos = [];
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const euros = (n) => Number(n).toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
const nombreCompleto = (p) => p ? `${p.nombre} ${p.apellidos}` : '';

function edadDe(alumno) { return calcularEdad(alumno.fecha_nacimiento); }

function cumpleElegibilidad(alumno, modo, cursos, edadMin, edadMax) {
  if (modo === 'edad') {
    const edad = edadDe(alumno);
    if (edad === null) return false;
    return (edadMin == null || edad >= edadMin) && (edadMax == null || edad <= edadMax);
  }
  if (!cursos || cursos.length === 0) return false;
  return cursos.some(c => c.etapa === alumno.etapa && c.curso === alumno.curso);
}

function miembrosElegiblesEvento(evento) {
  if (evento.tipo_elegibilidad === 'toda_familia') return { adultos: misAdultos, alumnos: misAlumnos };
  if (evento.tipo_elegibilidad === 'adultos') return { adultos: misAdultos, alumnos: [] };
  return { adultos: [], alumnos: misAlumnos.filter(a => cumpleElegibilidad(a, evento.elegibilidad_modo, evento.cursos_permitidos, evento.edad_min, evento.edad_max)) };
}

function claveMiembro(tipo, id) { return tipo + ':' + id; }

function estadoInscripcionSocio(evento) {
  const ahora = new Date();
  if (evento.sorteo_realizado) return { abierta: false, mensaje: 'El sorteo ya se ha hecho.' };
  if (evento.fecha_apertura_socios && ahora < new Date(evento.fecha_apertura_socios)) {
    return { abierta: false, mensaje: 'Se abre para socios el ' + new Date(evento.fecha_apertura_socios).toLocaleString('es-ES', { dateStyle: 'long', timeStyle: 'short' }) + '.' };
  }
  if (evento.fecha_cierre_inscripcion && ahora >= new Date(evento.fecha_cierre_inscripcion)) {
    return { abierta: false, mensaje: 'El plazo de inscripción está cerrado.' };
  }
  return { abierta: true, mensaje: '' };
}

// Mensajes de error de la base de datos, sin la jerga técnica
function textoError(error) {
  const m = (error && error.message) || String(error);
  return m.replace(/^.*?ERROR:\s*/, '');
}

async function cargarEventos() {
  const cont = document.getElementById('eventosContainer');
  const { data: eventos, error } = await sb.from('eventos').select('*').eq('activo', true).order('fecha', { ascending: true });
  document.getElementById('loadingMsg').style.display = 'none';
  if (error) { cont.innerHTML = '<p class="msg-error">No se pudieron cargar los eventos. Recarga la página.</p>'; return; }

  const visibles = (eventos || []).filter(ev => {
    if (ev.sin_inscripcion) return true;
    const el = miembrosElegiblesEvento(ev);
    return el.adultos.length > 0 || el.alumnos.length > 0;
  });
  if (!visibles.length) { cont.innerHTML = '<p class="empty-hint">No hay eventos para tu familia ahora mismo.</p>'; return; }

  cont.innerHTML = '';
  for (const ev of visibles) cont.appendChild(await renderEvento(ev));
  activarFiltros();
}

function activarFiltros() {
  const caja = document.getElementById('filtros');
  const tarjetas = () => [...document.querySelectorAll('#eventosContainer .evento-card')];
  if (tarjetas().length < 2) { caja.hidden = true; return; }
  caja.hidden = false;
  caja.querySelectorAll('button').forEach(b => {
    const n = b.dataset.f === 'todos' ? tarjetas().length : tarjetas().filter(t => t.dataset[b.dataset.f]).length;
    b.textContent = b.textContent.replace(/ \(\d+\)$/, '') + ` (${n})`;
    b.onclick = () => {
      caja.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      tarjetas().forEach(t => { t.hidden = b.dataset.f !== 'todos' && !t.dataset[b.dataset.f]; });
    };
  });
}

async function repintar(card, evento) {
  const { data } = await sb.from('eventos').select('*').eq('id', evento.id).single();
  card.replaceWith(await renderEvento(data || evento));
}

/* ==================== Router según el tipo de evento ==================== */
async function renderEvento(evento) {
  if (evento.sin_inscripcion) return cabeceraEvento(evento);
  if (evento.usa_concurso_texto) return renderEventoConcurso(evento);
  if (evento.requiere_pareja_adulto_alumno) return renderEventoPareja(evento);
  return renderEventoNormal(evento);
}

function textoPrecios(ev) {
  const partes = [];
  const pAlumno = Number(ev.precio_alumno) || 0, pAdulto = Number(ev.precio_adulto) || 0;
  if (ev.tipo_elegibilidad !== 'adultos' && (pAlumno || pAdulto)) partes.push(pAlumno ? `Alumnos socios: ${euros(pAlumno)}.` : 'Alumnos socios: gratis.');
  if (pAdulto) partes.push(ev.tipo_elegibilidad === 'alumnos'
    ? `Los adultos no se apuntan: pagan ${euros(pAdulto)} en la entrada.`
    : `Adultos socios: ${euros(pAdulto)}, se paga en el evento.`);
  if (ev.permite_invitados && Number(ev.precio_invitado) > 0) partes.push(`Personas no socias: ${euros(ev.precio_invitado)} cada una.`);
  return partes.join(' ');
}

function htmlPremios(lista) {
  if (!lista || !lista.length) return '';
  return '<ul class="premios">' + lista.map(p => `<li><b>${esc(p.puesto)}</b>${p.premio ? ': ' + esc(p.premio) : ''}${p.ganador ? `<span class="ganador">Ganador/a: ${esc(p.ganador)}</span>` : ''}</li>`).join('') + '</ul>';
}
const premiosCache = {};
async function premiosDe(eventoId) {
  if (!premiosCache[eventoId]) {
    const { data } = await sb.from('evento_premios').select('*').eq('evento_id', eventoId).order('orden').order('created_at');
    premiosCache[eventoId] = data || [];
  }
  return premiosCache[eventoId];
}

// Color e icono según el tipo de evento
const TIPOS_VISUAL = {
  chocolatada: ['rosa', '<path d="M5 9h11v6a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5z"/><path d="M16 11h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M8 3c0 1.5 1 1.5 1 3M11 3c0 1.5 1 1.5 1 3"/>'],
  cabalgata: ['cielo', '<path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z"/>'],
  juegos: ['amarillo', '<rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1.2"/><circle cx="15" cy="15" r="1.2"/><circle cx="15" cy="9" r="1.2"/><circle cx="9" cy="15" r="1.2"/>'],
  taller: ['amarillo', '<path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/>'],
  barbacoa: ['verde', '<path d="M12 3c2 3 5 5 5 9a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3 1-5 1-8z"/>'],
  comedor: ['morado', '<path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 0-3 2-3 6h3v12"/>'],
  concurso: ['rosa', '<path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/>'],
  informativo: ['morado', '<path d="M8 4h8v5a4 4 0 0 1-8 0zM5 5h3v2a3 3 0 0 1-3-2zM19 5h-3v2a3 3 0 0 0 3-2zM12 13v4M8 20h8"/>']
};
const ICONO_EVENTO = '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>';

function iniciales(nombre) {
  return String(nombre || '').split(/\s+/).filter(Boolean).slice(0, 2).map(p => p[0]).join('').toUpperCase();
}
function avatar(nombre) { return `<span class="avatar" aria-hidden="true">${esc(iniciales(nombre))}</span>`; }

function cabeceraEvento(evento) {
  const card = document.createElement('article');
  // Eventos sin tipo: un color del logo fijo para cada uno, para que no sean todos iguales
  const PALETA = ['verde', 'rosa', 'amarillo', 'cielo', 'morado'];
  const hash = [...String(evento.id)].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
  const [color, icono] = TIPOS_VISUAL[evento.plantilla] || [PALETA[hash % PALETA.length], ICONO_EVENTO];
  card.className = 'card evento-card t-' + color;
  const precios = textoPrecios(evento);
  const f = evento.fecha ? new Date(evento.fecha) : null;
  card.innerHTML = `
    <header class="ev-cab">
      ${f ? `<div class="ev-fecha"><span>${f.toLocaleDateString('es-ES', { month: 'short' }).replace('.', '')}</span><b>${f.getDate()}</b><span>${f.toLocaleDateString('es-ES', { weekday: 'short' }).replace('.', '')}</span></div>` : '<div class="ev-fecha"><b>?</b><span>fecha</span></div>'}
      <div class="ev-tit">
        <h2>${esc(evento.titulo)}</h2>
        <p class="ev-hora">${f ? f.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' }) + ', a las ' + f.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }) : 'Fecha por confirmar'}</p>
        <div class="etiquetas"></div>
      </div>
      <svg class="ev-icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icono}</svg>
    </header>
    <div class="eventoCarrusel ev-fotos"></div>
    ${evento.descripcion ? `<p class="ev-desc">${esc(evento.descripcion)}</p>` : ''}
    ${precios ? `<p class="precios">${esc(precios)}</p>` : ''}
    <div class="ev-premios"></div>
  `;
  sb.from('fotos_carrusel').select('url').eq('evento_id', evento.id).order('orden').then(({ data: fotos }) => {
    const c = card.querySelector('.eventoCarrusel');
    if (fotos && fotos.length) renderCarrusel(c, fotos.map(f => f.url)); else c.remove();
  });
  premiosDe(evento.id).then(lista => {
    const delEvento = lista.filter(p => !p.actividad_id);
    const hueco = card.querySelector('.ev-premios');
    if (delEvento.length) hueco.outerHTML = '<div class="bloque-premios"><h3>Premios</h3>' + htmlPremios(delEvento) + '</div>';
    else hueco.remove();
  });
  return card;
}
function etiqueta(card, texto, llena) {
  const s = document.createElement('span');
  s.className = 'etiqueta' + (llena ? ' llena' : '');
  s.textContent = texto;
  card.querySelector('.etiquetas').appendChild(s);
}

/* ---------- Mini formulario con los datos que pide el evento ---------- */
// Devuelve un elemento con los campos y una función leer() que devuelve
// { ok, datos, error }. tipo: 'adulto' | 'alumno' | 'invitado'
function camposPersona(evento, tipo, opciones = {}) {
  const wrap = document.createElement('div');
  wrap.className = 'mini-form';
  const id = 'f' + Math.random().toString(36).slice(2, 8);
  let html = '';
  if (tipo === 'invitado') {
    html += `<div class="dos">
      <div class="field"><label for="${id}n">Nombre</label><input type="text" id="${id}n"></div>
      <div class="field"><label for="${id}a">Apellidos</label><input type="text" id="${id}a"></div></div>
      <div class="dos">
      ${opciones.pideDni
        ? `<div class="field"><label for="${id}d">DNI/NIE</label><input type="text" id="${id}d"></div>`
        : `<div class="field"><label for="${id}e">Edad</label><input type="number" id="${id}e" min="0" max="110"></div>`}
      </div>`;
  }
  if (evento.pide_alergias) {
    html += `<div><span style="font-weight:700;">¿Tiene alguna alergia o intolerancia?</span>
      <div class="radios" style="margin-top:6px;"><label><input type="radio" name="${id}al" value="no"> No</label><label><input type="radio" name="${id}al" value="si"> Sí</label></div>
      <input type="text" id="${id}alt" placeholder="¿Cuáles?" hidden style="margin-top:8px;"></div>`;
  }
  if (tipo === 'alumno' && evento.pregunta_extra && (evento.pregunta_opciones || []).length) {
    html += `<div class="field"><label for="${id}p">${esc(evento.pregunta_extra)}</label>
      <select id="${id}p"><option value="">Elige una opción</option>${evento.pregunta_opciones.map(o => `<option>${esc(o)}</option>`).join('')}</select></div>`;
  }
  if (opciones.pideResponsable) {
    html += camposAcompanante(id);
  }
  wrap.innerHTML = html;
  const q = (s) => wrap.querySelector('#' + id + s);
  wrap.querySelectorAll(`input[name="${id}al"]`).forEach(r => r.addEventListener('change', () => { q('alt').hidden = r.value !== 'si' || !r.checked; }));

  wrap.leer = () => {
    const datos = {};
    if (tipo === 'invitado') {
      datos.nombre_invitado = q('n').value.trim();
      datos.apellidos_invitado = q('a').value.trim();
      if (!datos.nombre_invitado || !datos.apellidos_invitado) return { error: 'Escribe nombre y apellidos.' };
      if (opciones.pideDni) {
        datos.dni_invitado = q('d').value.trim();
        if (!datos.dni_invitado) return { error: 'Escribe el DNI/NIE del adulto (hace falta para el documento).' };
      } else {
        const e = q('e').value;
        if (e === '') return { error: 'Escribe la edad.' };
        datos.edad = parseInt(e, 10);
      }
    }
    if (evento.pide_alergias) {
      const sel = wrap.querySelector(`input[name="${id}al"]:checked`);
      if (!sel) return { error: 'Indica si tiene alergias.' };
      datos.tiene_alergias = sel.value === 'si';
      datos.alergias = datos.tiene_alergias ? q('alt').value.trim() : null;
      if (datos.tiene_alergias && !datos.alergias) return { error: 'Escribe qué alergias tiene.' };
    }
    if (q('p')) {
      datos.respuesta_extra = q('p').value;
      if (!datos.respuesta_extra) return { error: 'Responde: ' + evento.pregunta_extra };
    }
    if (q('rn')) {
      datos._acomp = { numero: q('rn').value.trim(), nombre: q('rnom').value.trim() };
      if (!datos._acomp.numero || !datos._acomp.nombre) return { error: 'Escribe el número de socio y el nombre del adulto que le acompaña.' };
    }
    return { datos };
  };
  wrap.vacio = html === '';
  return wrap;
}

// Adulto socio de OTRA familia que acompaña a los alumnos (tiene que estar apuntado)
function camposAcompanante(id) {
  return `<div class="falta-adulto" style="margin:0;"><p style="margin:0 0 8px; font-weight:700;">Acompaña a otro socio</p>
    <p style="margin:0 0 10px; font-size:15px;">Ningún adulto de tu familia está apuntado. El alumno o alumna puede ir con un adulto socio de otra familia que ya esté apuntado.</p>
    <div class="dos"><div class="field"><label for="${id}rn">Número de socio</label><input type="text" inputmode="numeric" id="${id}rn" placeholder="Ej. 0007"></div>
    <div class="field"><label for="${id}rnom">Nombre del adulto</label><input type="text" id="${id}rnom" placeholder="Nombre y apellidos"></div></div></div>`;
}
// Comprueba el acompañante en la base de datos y devuelve los datos a guardar
async function resolverAcompanante(evento, acomp) {
  const { data, error } = await sb.rpc('evento_buscar_acompanante', { p_evento_id: evento.id, p_numero: acomp.numero, p_nombre: acomp.nombre });
  if (error) throw error;
  const a = data && data[0];
  if (!a) throw new Error('No se encontró a ese adulto.');
  return { responsable_adulto_id: a.adulto_id, responsable_nombre: `${a.nombre} (socio nº ${acomp.numero})` };
}

function detalleInscripcion(i, evento) {
  const partes = [];
  if (evento.pide_alergias) partes.push(i.tiene_alergias ? 'Alergias: ' + (i.alergias || 'sí') : 'Sin alergias');
  if (i.respuesta_extra) partes.push(i.respuesta_extra);
  if (i.responsable_nombre) partes.push('Va con ' + i.responsable_nombre);
  return partes.join('. ');
}

/* ==================== Evento normal (Chocolatada, Talleres, Barbacoa, Comedor...) ==================== */
async function renderEventoNormal(evento) {
  const elegibles = miembrosElegiblesEvento(evento);
  const gate = estadoInscripcionSocio(evento);
  const esSorteo = evento.metodo_asignacion === 'sorteo';

  const [{ data: actividades }, { data: exclusiones }, { data: misInscripciones }] = await Promise.all([
    sb.from('evento_actividades').select('*').eq('evento_id', evento.id).order('created_at'),
    sb.from('actividad_exclusiones').select('*'),
    sb.from('evento_inscripciones').select('*, comprobantes_pago(verificado)').eq('evento_id', evento.id).eq('socio_id', ctxGlobal.socio.id)
  ]);
  const ins = misInscripciones || [];
  const principales = ins.filter(i => !i.actividad_id && !i.es_voluntario);
  const card = cabeceraEvento(evento);

  let plazasLibres = null;
  if (esSorteo) {
    etiqueta(card, evento.sorteo_realizado ? 'Sorteo hecho' : 'Por sorteo' + (evento.aforo_total ? `, ${evento.aforo_total} plazas` : ''));
  } else if (evento.aforo_total != null) {
    plazasLibres = (await sb.rpc('evento_plazas_disponibles', { p_evento_id: evento.id })).data;
    if (plazasLibres != null) etiqueta(card, plazasLibres > 0 ? `${plazasLibres} plazas libres` : 'Completo', plazasLibres <= 0);
  }
  if (!gate.abierta) etiqueta(card, gate.mensaje.replace(/\.$/, ''), true);
  else if (evento.fecha_cierre_inscripcion) etiqueta(card, 'Inscripción hasta el ' + new Date(evento.fecha_cierre_inscripcion).toLocaleDateString('es-ES', { day: 'numeric', month: 'long' }));

  const inscripcionDe = (tipo, id, actividadId = null, voluntario = false) =>
    ins.find(i => i.tipo_miembro === tipo && (tipo === 'adulto' ? i.adulto_id : i.alumno_id) === id
      && (i.actividad_id || null) === actividadId && !!i.es_voluntario === voluntario);
  const hayAdultoFamilia = () => principales.some(i => i.tipo_miembro === 'adulto');

  async function apuntar(m, actividadId, datos, msgEl) {
    if (datos._acomp) {
      try { Object.assign(datos, await resolverAcompanante(evento, datos._acomp)); }
      catch (e) { msgEl.className = 'msg-error'; msgEl.textContent = textoError(e); msgEl.hidden = false; return; }
      delete datos._acomp;
    }
    const payload = { evento_id: evento.id, actividad_id: actividadId || null, tipo_miembro: m.tipo, socio_id: ctxGlobal.socio.id, ...datos };
    if (m.tipo === 'adulto') payload.adulto_id = m.id; else payload.alumno_id = m.id;
    const { error } = await sb.from('evento_inscripciones').insert(payload);
    if (error) { msgEl.className = 'msg-error'; msgEl.textContent = textoError(error); msgEl.hidden = false; return; }
    repintar(card, evento);
  }
  async function quitar(i) {
    const { error } = await sb.from('evento_inscripciones').delete().eq('id', i.id);
    if (error) { alert(textoError(error)); return; }
    repintar(card, evento);
  }

  card.dataset.abierto = gate.abierta ? '1' : '';
  card.dataset.apuntado = ins.length ? '1' : '';

  /* ---- Asistentes ---- */
  const bloque = document.createElement('div');
  bloque.className = 'bloque';
  bloque.innerHTML = `<h3>${evento.tipo_elegibilidad === 'alumnos' ? 'Alumnos' : evento.tipo_elegibilidad === 'adultos' ? 'Adultos' : 'Tu familia'}</h3>`;
  const miembros = [
    ...elegibles.adultos.map(a => ({ tipo: 'adulto', id: a.id, nombre: nombreCompleto(a), sub: '' })),
    ...elegibles.alumnos.map(a => ({ tipo: 'alumno', id: a.id, nombre: nombreCompleto(a), sub: `${a.curso} ${a.etapa}` }))
  ];
  miembros.forEach(m => {
    const i = inscripcionDe(m.tipo, m.id);
    const fila = document.createElement('div');
    fila.className = 'miembro';
    fila.innerHTML = `<div class="miembro-fila"><span class="persona">${avatar(m.nombre)}<span class="nombre">${esc(m.nombre)}<span class="detalle">${esc([m.sub, i ? detalleInscripcion(i, evento) : ''].filter(Boolean).join('. '))}</span></span></span><span class="accion"></span></div>`;
    const accion = fila.querySelector('.accion');
    const msg = document.createElement('p'); msg.hidden = true; msg.className = 'msg-error';

    if (evento.sorteo_realizado) {
      accion.innerHTML = !i ? '<span class="estado-gris">No participó</span>'
        : i.estado === 'ganador' ? '<span class="estado-ok">Tiene plaza</span>'
        : i.estado === 'no_ganador' ? '<span class="estado-no">No salió en el sorteo</span>' : '<span class="estado-gris">Pendiente</span>';
    } else if (i) {
      accion.innerHTML = `<span class="estado-ok">Apuntado/a</span>`;
      if (gate.abierta) {
        const b = document.createElement('button'); b.className = 'btn-danger-link'; b.textContent = 'Quitar';
        b.addEventListener('click', () => quitar(i));
        accion.appendChild(b);
      }
      // Alumno sin adulto encargado (p. ej. se quitó al adulto de la familia después)
      if (m.tipo === 'alumno' && evento.alumnos_requieren_adulto && !i.responsable_adulto_id && !hayAdultoFamilia()) {
        const aid = 'fa' + i.id.slice(0, 6);
        const aviso = document.createElement('div');
        aviso.style.marginTop = '8px';
        aviso.innerHTML = camposAcompanante(aid) + '<button class="btn btn-primary" type="button" style="margin-top:8px;">Guardar acompañante</button><p class="msg-error" hidden></p>';
        aviso.querySelector('button').addEventListener('click', async () => {
          const err = aviso.querySelector('.msg-error');
          const acomp = { numero: aviso.querySelector('#' + aid + 'rn').value.trim(), nombre: aviso.querySelector('#' + aid + 'rnom').value.trim() };
          try {
            const datos = await resolverAcompanante(evento, acomp);
            const { error } = await sb.from('evento_inscripciones').update(datos).eq('id', i.id);
            if (error) throw error;
            repintar(card, evento);
          } catch (e) { err.textContent = textoError(e); err.hidden = false; }
        });
        fila.appendChild(aviso);
      }
    } else if (!gate.abierta) {
      accion.innerHTML = '<span class="estado-gris">No apuntado/a</span>';
    } else if (plazasLibres != null && plazasLibres <= 0) {
      accion.innerHTML = '<span class="estado-no">Completo</span>';
    } else if (evento.voluntariado_excluye_asistencia && inscripcionDe(m.tipo, m.id, null, true)) {
      accion.innerHTML = '<span class="estado-gris">Va como voluntario/a</span>';
    } else if (m.tipo === 'alumno' && evento.alumnos_requieren_adulto && !hayAdultoFamilia()) {
      // Sin ningún adulto de la familia apuntado: solo puede ir con un adulto socio de otra familia
      const t = document.createElement('label');
      t.className = 'check-acomp';
      t.innerHTML = '<input type="checkbox"> Acompaña a otro socio';
      accion.appendChild(t);
      const cb = t.querySelector('input');
      let form = null;
      cb.addEventListener('change', () => {
        if (!cb.checked) { if (form) form.remove(); form = null; return; }
        form = camposPersona(evento, 'alumno', { pideResponsable: true });
        const ok = document.createElement('div');
        ok.style.cssText = 'display:flex; gap:12px; align-items:center; flex-wrap:wrap;';
        ok.innerHTML = '<button type="button" class="btn btn-primary">Apuntar</button>';
        form.appendChild(ok); form.appendChild(msg);
        ok.children[0].addEventListener('click', () => {
          const r = form.leer();
          if (r.error) { msg.textContent = r.error; msg.hidden = false; return; }
          apuntar(m, null, r.datos, msg);
        });
        fila.appendChild(form);
      });
    } else {
      const b = document.createElement('button'); b.className = 'btn btn-outline'; b.textContent = 'Apuntar';
      accion.appendChild(b);
      b.addEventListener('click', () => {
        const form = camposPersona(evento, m.tipo, {});
        if (form.vacio) { apuntar(m, null, {}, msg); return; }
        b.hidden = true;
        const ok = document.createElement('div');
        ok.style.cssText = 'display:flex; gap:12px; align-items:center; flex-wrap:wrap;';
        ok.innerHTML = '<button type="button" class="btn btn-primary">Confirmar</button><button type="button" class="linklike">Cancelar</button>';
        form.appendChild(ok); form.appendChild(msg);
        ok.children[1].addEventListener('click', () => { form.remove(); b.hidden = false; });
        ok.children[0].addEventListener('click', () => {
          const r = form.leer();
          if (r.error) { msg.textContent = r.error; msg.hidden = false; return; }
          apuntar(m, null, r.datos, msg);
        });
        fila.appendChild(form);
      });
    }
    fila.appendChild(msg);
    bloque.appendChild(fila);
  });
  card.appendChild(bloque);

  /* ---- Subactividades / torneos ---- */
  if (actividades && actividades.length) {
    const sub = document.createElement('div');
    sub.className = 'bloque';
    sub.innerHTML = '<h3>Actividades dentro del evento</h3><p class="ayuda">Para apuntarse a una actividad hay que estar apuntado/a al evento.</p>';
    const excluyentes = (actId) => (exclusiones || []).filter(x => x.actividad_id_1 === actId || x.actividad_id_2 === actId)
      .map(x => x.actividad_id_1 === actId ? x.actividad_id_2 : x.actividad_id_1);
    for (const act of actividades) {
      const libres = act.aforo != null ? (await sb.rpc('actividad_plazas_disponibles', { p_actividad_id: act.id })).data : null;
      const box = document.createElement('div');
      box.className = 'actividad';
      box.innerHTML = `<div class="miembro-fila"><h4>${esc(act.nombre)}</h4><span class="estado-gris">${esc(act.horario || '')}${libres != null ? (act.horario ? ', ' : '') + (libres > 0 ? libres + ' plazas libres' : 'completo') : ''}</span></div>`
        + htmlPremios((await premiosDe(evento.id)).filter(p => p.actividad_id === act.id));
      // Las subactividades (torneos, rol, ajedrez...) son solo para alumnos
      const candidatos = miembros.filter(m => m.tipo === 'alumno')
        .filter(m => !act.elegibilidad_modo || m.tipo !== 'alumno' || cumpleElegibilidad(misAlumnos.find(a => a.id === m.id), act.elegibilidad_modo, act.cursos_permitidos, act.edad_min, act.edad_max));
      candidatos.forEach(m => {
        const enPrincipal = inscripcionDe(m.tipo, m.id);
        const i = inscripcionDe(m.tipo, m.id, act.id);
        const fila = document.createElement('div');
        fila.className = 'miembro';
        fila.innerHTML = `<div class="miembro-fila"><span>${esc(m.nombre)}</span><span class="accion"></span></div>`;
        const accion = fila.querySelector('.accion');
        const choca = !i && ins.some(x => x.tipo_miembro === m.tipo && (m.tipo === 'adulto' ? x.adulto_id : x.alumno_id) === m.id && x.actividad_id && excluyentes(act.id).includes(x.actividad_id));
        if (i) {
          accion.innerHTML = '<span class="estado-ok">Apuntado/a</span>';
          if (gate.abierta) { const b = document.createElement('button'); b.className = 'btn-danger-link'; b.textContent = 'Quitar'; b.addEventListener('click', () => quitar(i)); accion.appendChild(b); }
        } else if (!enPrincipal) accion.innerHTML = '<span class="estado-gris">Primero apúntalo/a al evento</span>';
        else if (!gate.abierta) accion.innerHTML = '<span class="estado-gris">Inscripción cerrada</span>';
        else if (choca) accion.innerHTML = '<span class="estado-gris">Coincide con otra actividad elegida</span>';
        else if (libres != null && libres <= 0) accion.innerHTML = '<span class="estado-no">Completo</span>';
        else {
          const msg = document.createElement('p'); msg.hidden = true;
          const b = document.createElement('button'); b.className = 'btn btn-outline'; b.textContent = 'Apuntar';
          b.addEventListener('click', () => apuntar(m, act.id, {}, msg));
          accion.appendChild(b); fila.appendChild(msg);
        }
        box.appendChild(fila);
      });
      sub.appendChild(box);
    }
    card.appendChild(sub);
  }

  /* ---- Personas no socias invitadas por la familia ---- */
  if (evento.permite_invitados) card.appendChild(bloqueInvitados(evento, ins, gate, card, plazasLibres));

  /* ---- Voluntarios ---- */
  if (evento.voluntariado_modo && evento.voluntariado_modo !== 'no') card.appendChild(bloqueVoluntarios(evento, ins, gate, card));

  /* ---- Documentos a rellenar y firmar ---- */
  const docs = await bloqueDocumentos(evento, principales);
  if (docs) card.appendChild(docs);
  return card;
}

function bloqueInvitados(evento, ins, gate, card, plazasLibres) {
  const precio = Number(evento.precio_invitado) || 0;
  const b = document.createElement('div');
  b.className = 'bloque';
  b.innerHTML = `<h3>Personas no socias</h3>
    <p class="ayuda">Puedes apuntar a familiares o amigos que no son socios${precio ? `. Cada persona paga ${euros(precio)} por transferencia y subes el justificante` : ''}.</p>`;
  const invitados = ins.filter(i => i.tipo_miembro === 'invitado' && !i.actividad_id);
  invitados.forEach(i => {
    const comp = (i.comprobantes_pago || [])[0];
    const fila = document.createElement('div');
    fila.className = 'miembro';
    fila.innerHTML = `<div class="miembro-fila"><span class="nombre">${esc(i.nombre_invitado)} ${esc(i.apellidos_invitado || '')}<span class="detalle">${esc([i.edad != null ? i.edad + ' años' : '', detalleInscripcion(i, evento), precio ? (comp ? (comp.verificado ? 'Pago comprobado' : 'Justificante enviado') : 'Falta el justificante') : ''].filter(Boolean).join('. '))}</span></span><span class="accion"></span></div>`;
    if (gate.abierta) {
      const q = document.createElement('button'); q.className = 'btn-danger-link'; q.textContent = 'Quitar';
      q.addEventListener('click', async () => {
        if (!confirm('¿Quitar a ' + i.nombre_invitado + '? Si ya pagó, la Junta gestiona la devolución.')) return;
        const { error } = await sb.from('evento_inscripciones').delete().eq('id', i.id);
        if (error) { alert(textoError(error)); return; }
        repintar(card, evento);
      });
      fila.querySelector('.accion').appendChild(q);
    }
    b.appendChild(fila);
  });
  if (!gate.abierta || (plazasLibres != null && plazasLibres <= 0)) return b;

  const abrir = document.createElement('button');
  abrir.className = 'btn btn-outline'; abrir.type = 'button'; abrir.textContent = 'Añadir persona no socia';
  abrir.style.marginTop = '10px';
  b.appendChild(abrir);
  abrir.addEventListener('click', () => {
    abrir.hidden = true;
    const form = camposPersona(evento, 'invitado');
    const extra = document.createElement('div');
    extra.style.cssText = 'display:grid; gap:12px;';
    if (precio) {
      extra.innerHTML = `<div class="datos-pago">
          <div><span>Importe</span><b>${euros(precio)}</b></div>
          <div><span>IBAN</span><b class="iban">${AMPA_IBAN}</b></div>
          <div><span>Titular</span><b>${AMPA_TITULAR_CUENTA}</b></div>
          <div><span>Concepto</span><b>${esc(evento.titulo)} + nombre del invitado</b></div></div>
        <div class="field"><label>Justificante de la transferencia</label><input type="file" class="justif" accept="image/*,.pdf"></div>`;
    }
    extra.insertAdjacentHTML('beforeend', '<div style="display:flex; gap:12px; flex-wrap:wrap; align-items:center;"><button type="button" class="btn btn-primary ok">Apuntar</button><button type="button" class="linklike cancel">Cancelar</button></div><p class="msg-error" hidden></p>');
    form.appendChild(extra);
    const msg = extra.querySelector('.msg-error');
    extra.querySelector('.cancel').addEventListener('click', () => { form.remove(); abrir.hidden = false; });
    extra.querySelector('.ok').addEventListener('click', async () => {
      const r = form.leer();
      if (r.error) { msg.textContent = r.error; msg.hidden = false; return; }
      const file = precio ? extra.querySelector('.justif').files[0] : null;
      if (precio && !file) { msg.textContent = 'Sube el justificante de la transferencia.'; msg.hidden = false; return; }
      const id = crypto.randomUUID();
      const { error } = await sb.from('evento_inscripciones').insert({ id, evento_id: evento.id, tipo_miembro: 'invitado', socio_id: ctxGlobal.socio.id, ...r.datos });
      if (error) { msg.textContent = textoError(error); msg.hidden = false; return; }
      if (file) {
        const path = `${ctxGlobal.socio.id}/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9.\-_]/g, '_')}`;
        const { error: upErr } = await sb.storage.from('comprobantes').upload(path, file);
        if (!upErr) await sb.from('comprobantes_pago').insert({ tipo: 'invitado_evento', evento_inscripcion_id: id, archivo_url: path });
      }
      repintar(card, evento);
    });
    b.appendChild(form);
  });
  return b;
}

function bloqueVoluntarios(evento, ins, gate, card) {
  const b = document.createElement('div');
  b.className = 'bloque';
  b.innerHTML = `<h3>Voluntarios</h3><p class="ayuda">${evento.voluntariado_modo === 'adultos_y_ninos'
    ? 'Pueden ayudar adultos, solos o con alumnos de su familia. Un alumno o alumna solo puede ser voluntario si va con un adulto de la familia que también lo sea.'
    : 'Buscamos adultos que echen una mano.'} Los voluntarios no ocupan plaza.</p>`;
  const vol = ins.filter(i => i.es_voluntario);
  const adultosVol = vol.filter(i => i.tipo_miembro === 'adulto');
  const lista = [
    ...misAdultos.map(a => ({ tipo: 'adulto', p: a })),
    ...(evento.voluntariado_modo === 'adultos_y_ninos' ? misAlumnos.map(a => ({ tipo: 'alumno', p: a })) : [])
  ];
  lista.forEach(({ tipo, p }) => {
    const i = vol.find(v => v.tipo_miembro === tipo && (tipo === 'adulto' ? v.adulto_id : v.alumno_id) === p.id);
    const fila = document.createElement('div');
    fila.className = 'miembro';
    fila.innerHTML = `<div class="miembro-fila"><span class="persona">${avatar(nombreCompleto(p))}<span>${esc(nombreCompleto(p))}</span></span><span class="accion"></span></div>`;
    const accion = fila.querySelector('.accion');
    if (i) {
      accion.innerHTML = '<span class="estado-ok">Voluntario/a</span>';
      if (gate.abierta) {
        const q = document.createElement('button'); q.className = 'btn-danger-link'; q.textContent = 'Quitar';
        q.addEventListener('click', async () => {
          if (tipo === 'adulto' && adultosVol.length === 1 && vol.some(v => v.tipo_miembro === 'alumno')) {
            alert('Quita antes a los alumnos voluntarios: no pueden ir sin un adulto de la familia.'); return;
          }
          const { error } = await sb.from('evento_inscripciones').delete().eq('id', i.id);
          if (error) { alert(textoError(error)); return; }
          repintar(card, evento);
        });
        accion.appendChild(q);
      }
    } else if (!gate.abierta) {
      accion.innerHTML = '';
    } else if (tipo === 'alumno' && !adultosVol.length) {
      accion.innerHTML = '<span class="estado-gris">Primero un adulto de la familia</span>';
    } else {
      const btn = document.createElement('button'); btn.className = 'btn btn-outline'; btn.textContent = 'Ser voluntario/a';
      const msg = document.createElement('p'); msg.className = 'msg-error'; msg.hidden = true;
      btn.addEventListener('click', async () => {
        const payload = { evento_id: evento.id, tipo_miembro: tipo, socio_id: ctxGlobal.socio.id, es_voluntario: true };
        if (tipo === 'adulto') payload.adulto_id = p.id; else payload.alumno_id = p.id;
        const { error } = await sb.from('evento_inscripciones').insert(payload);
        if (error) { msg.textContent = textoError(error); msg.hidden = false; return; }
        repintar(card, evento);
      });
      accion.appendChild(btn); fila.appendChild(msg);
    }
    b.appendChild(fila);
  });
  return b;
}

/* ---------- Documentos a rellenar y firmar ----------
   personas: inscripciones de la familia (adultos, alumnos e invitados) */
async function bloqueDocumentos(evento, inscripciones) {
  const { data: documentos } = await sb.from('documentos_evento').select('*').eq('evento_id', evento.id);
  if (!documentos || !documentos.length) return null;
  const { data: misRespuestas } = await sb.from('documentos_evento_respuestas').select('*').eq('socio_id', ctxGlobal.socio.id);

  // Personas que tienen que rellenar: las apuntadas (tras el sorteo, solo las que tienen plaza)
  const validas = inscripciones.filter(i => !evento.sorteo_realizado || i.estado === 'ganador');
  const b = document.createElement('div');
  b.className = 'bloque';
  b.innerHTML = '<h3>Documentos que hay que firmar</h3>';
  let alguno = false;
  for (const doc of documentos) {
    const personas = [];
    validas.forEach(i => {
      if (doc.aplica_a === 'adulto' && i.tipo_miembro === 'adulto') {
        const a = misAdultos.find(x => x.id === i.adulto_id); if (a) personas.push({ persona: a, clave: { adulto_id: a.id } });
      } else if (doc.aplica_a === 'adulto' && i.tipo_miembro === 'invitado') {
        personas.push({ persona: { id: null, nombre: i.nombre_invitado, apellidos: i.apellidos_invitado || '', dni_nie: i.dni_invitado || '' }, clave: { evento_inscripcion_id: i.id } });
      } else if (doc.aplica_a === 'alumno' && i.tipo_miembro === 'alumno') {
        const a = misAlumnos.find(x => x.id === i.alumno_id);
        if (a && (!doc.elegibilidad_modo || cumpleElegibilidad(a, doc.elegibilidad_modo, doc.cursos_permitidos, doc.edad_min, doc.edad_max) || !(doc.cursos_permitidos || []).length && doc.elegibilidad_modo === 'curso'))
          personas.push({ persona: a, clave: { alumno_id: a.id } });
      }
    });
    if (!personas.length) continue;
    alguno = true;
    const box = document.createElement('div');
    box.className = 'actividad';
    box.innerHTML = `<h4>${esc(doc.titulo)}</h4>`;
    personas.forEach(({ persona, clave }) => {
      const hecho = (misRespuestas || []).find(r => r.documento_evento_id === doc.id &&
        Object.entries(clave).every(([k, v]) => r[k] === v));
      const fila = document.createElement('div');
      fila.className = 'miembro';
      fila.innerHTML = `<div class="miembro-fila"><span>${esc(nombreCompleto(persona))}</span><span class="accion"></span></div>`;
      if (hecho) fila.querySelector('.accion').innerHTML = '<span class="estado-ok">Firmado</span>';
      else {
        const btn = document.createElement('button'); btn.className = 'btn btn-outline'; btn.textContent = 'Rellenar y firmar';
        btn.addEventListener('click', () => abrirRellenoDocumento(doc, persona, clave, box));
        fila.querySelector('.accion').appendChild(btn);
      }
      box.appendChild(fila);
    });
    const zona = document.createElement('div'); zona.className = 'docRellenoZona'; zona.style.marginTop = '12px';
    box.appendChild(zona);
    b.appendChild(box);
  }
  return alguno ? b : null;
}

async function abrirRellenoDocumento(doc, persona, clave, box) {
  const zona = box.querySelector('.docRellenoZona');
  zona.innerHTML = '<p class="loading">Cargando documento...</p>';
  try {
    const { dataUrl } = await renderizarPaginaPDF(doc.archivo_base_url, doc.pagina_rellenable);
    abrirFormularioRelleno(zona, dataUrl, doc.campos || [], persona, async (blob, datosFinales, avisoDiferencias) => {
      const path = `${ctxGlobal.socio.id}/${doc.id}/${Date.now()}.png`;
      const { error: upErr } = await sb.storage.from('documentos-evento').upload(path, blob);
      if (upErr) { alert('No se pudo subir el documento: ' + upErr.message); return; }
      const { data: urlData } = sb.storage.from('documentos-evento').getPublicUrl(path);
      const { error: insErr } = await sb.from('documentos_evento_respuestas').insert({
        documento_evento_id: doc.id, socio_id: ctxGlobal.socio.id, ...clave,
        archivo_final_url: urlData.publicUrl, datos_finales: datosFinales, aviso_diferencias: avisoDiferencias
      });
      if (insErr) { alert('No se pudo guardar: ' + insErr.message); return; }
      zona.innerHTML = '<p class="msg-ok">Documento firmado y guardado.</p>';
      setTimeout(() => cargarEventos(), 800);
    });
  } catch (err) {
    zona.innerHTML = '<p class="msg-error">No se pudo abrir el documento: ' + esc(err.message) + '</p>';
  }
}

/* ==================== Cabalgata: cada alumno con un adulto; adultos solos también ==================== */
async function renderEventoPareja(evento) {
  const card = cabeceraEvento(evento);
  const elegibles = miembrosElegiblesEvento(evento);
  const gate = estadoInscripcionSocio(evento);
  etiqueta(card, evento.sorteo_realizado ? 'Sorteo hecho' : `Por sorteo${evento.aforo_total ? `, ${evento.aforo_total} plazas para alumnos` : ''}`);
  if (!gate.abierta && !evento.sorteo_realizado) etiqueta(card, gate.mensaje.replace(/\.$/, ''), true);

  const { data } = await sb.from('evento_inscripciones').select('*').eq('evento_id', evento.id).eq('socio_id', ctxGlobal.socio.id);
  const ins = (data || []).filter(i => !i.actividad_id && !i.es_voluntario);
  const grupos = {};
  ins.forEach(i => { const g = i.grupo_id || i.id; (grupos[g] = grupos[g] || []).push(i); });

  card.dataset.abierto = gate.abierta ? '1' : '';
  card.dataset.apuntado = ins.length ? '1' : '';
  const nombreDe = (i) => i.tipo_miembro === 'adulto' ? nombreCompleto(misAdultos.find(a => a.id === i.adulto_id))
    : i.tipo_miembro === 'alumno' ? nombreCompleto(misAlumnos.find(a => a.id === i.alumno_id))
    : `${i.nombre_invitado} ${i.apellidos_invitado || ''} (no socio)`;

  const b = document.createElement('div');
  b.className = 'bloque';
  b.innerHTML = '<h3>Quién va de tu familia</h3><p class="ayuda">Cada alumno o alumna tiene que ir con un adulto. También pueden ir adultos solos. Las plazas son para alumnos y se sortean al cerrar el plazo; cada alumno que sale va con su adulto.</p>';
  const ordenTipo = { alumno: 0, adulto: 1, invitado: 1 };
  Object.entries(grupos).forEach(([g, filas]) => {
    filas.sort((x, y) => ordenTipo[x.tipo_miembro] - ordenTipo[y.tipo_miembro]);
    const est = filas[0].estado;
    const fila = document.createElement('div');
    fila.className = 'miembro';
    fila.innerHTML = `<div class="miembro-fila"><span class="nombre">${esc(filas.map(nombreDe).join(' con '))}<span class="detalle">${esc(filas.map(f => detalleInscripcion(f, evento)).filter(Boolean).join('. '))}</span></span><span class="accion"></span></div>`;
    const accion = fila.querySelector('.accion');
    if (evento.sorteo_realizado) {
      accion.innerHTML = est === 'ganador' ? '<span class="estado-ok">Tienen plaza</span>' : est === 'no_ganador' ? '<span class="estado-no">No salieron en el sorteo</span>' : '';
    } else if (gate.abierta) {
      const q = document.createElement('button'); q.className = 'btn-danger-link'; q.textContent = 'Quitar';
      q.addEventListener('click', async () => {
        const { error } = await sb.from('evento_inscripciones').delete().in('id', filas.map(f => f.id));
        if (error) { alert(textoError(error)); return; }
        repintar(card, evento);
      });
      accion.appendChild(q);
    }
    b.appendChild(fila);
  });
  if (!Object.keys(grupos).length) b.insertAdjacentHTML('beforeend', '<p class="empty-hint">Todavía no habéis apuntado a nadie.</p>');

  if (gate.abierta) {
    const adultosUsados = new Set(ins.filter(i => i.tipo_miembro === 'adulto').map(i => i.adulto_id));
    const alumnosUsados = new Set(ins.filter(i => i.tipo_miembro === 'alumno').map(i => i.alumno_id));
    const alumnosLibres = elegibles.alumnos.filter(a => !alumnosUsados.has(a.id));
    const adultosLibres = misAdultos.filter(a => !adultosUsados.has(a.id));

    const acciones = document.createElement('div');
    acciones.style.cssText = 'display:flex; gap:10px; flex-wrap:wrap; margin-top:12px;';
    if (alumnosLibres.length) acciones.insertAdjacentHTML('beforeend', '<button type="button" class="btn btn-primary conNino">Apuntar a un alumno con su adulto</button>');
    if (adultosLibres.length) acciones.insertAdjacentHTML('beforeend', '<button type="button" class="btn btn-outline soloAdulto">Apuntar a un adulto solo</button>');
    b.appendChild(acciones);
    const zona = document.createElement('div');
    b.appendChild(zona);

    const guardar = async (filas, msg) => {
      const grupo = crypto.randomUUID();
      const creadas = [];
      for (const f of filas) {
        const id = crypto.randomUUID();
        const { error } = await sb.from('evento_inscripciones').insert({ id, evento_id: evento.id, socio_id: ctxGlobal.socio.id, grupo_id: grupo, ...f });
        if (error) {
          if (creadas.length) await sb.from('evento_inscripciones').delete().in('id', creadas);   // nunca dejar un alumno sin su adulto
          msg.textContent = textoError(error); msg.hidden = false; return;
        }
        creadas.push(id);
      }
      repintar(card, evento);
    };

    const btnNino = acciones.querySelector('.conNino');
    if (btnNino) btnNino.addEventListener('click', () => {
      zona.innerHTML = '';
      const f = document.createElement('div');
      f.className = 'mini-form';
      f.innerHTML = `<div class="field"><label>Alumno o alumna</label><select class="selAl">${alumnosLibres.map(a => `<option value="${a.id}">${esc(nombreCompleto(a))}</option>`).join('')}</select></div>
        <div class="alDatos"></div>
        <div class="field"><label>Adulto que le acompaña</label><select class="selAd">${adultosLibres.map(a => `<option value="${a.id}">${esc(nombreCompleto(a))}</option>`).join('')}<option value="otro">Otro adulto, no socio (abuelo, tía...)</option></select></div>
        <div class="adDatos"></div>
        <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;"><button type="button" class="btn btn-primary ok">Apuntar a los dos</button><button type="button" class="linklike cancel">Cancelar</button></div>
        <p class="msg-error" hidden></p>`;
      const alForm = camposPersona(evento, 'alumno');
      if (!alForm.vacio) f.querySelector('.alDatos').appendChild(alForm);
      let adForm = null;
      const pintarAdulto = () => {
        const otro = f.querySelector('.selAd').value === 'otro';
        adForm = camposPersona(evento, otro ? 'invitado' : 'adulto', { pideDni: true });
        const cont = f.querySelector('.adDatos'); cont.innerHTML = '';
        if (!adForm.vacio) cont.appendChild(adForm);
      };
      f.querySelector('.selAd').addEventListener('change', pintarAdulto);
      pintarAdulto();
      f.querySelector('.cancel').addEventListener('click', () => { zona.innerHTML = ''; });
      f.querySelector('.ok').addEventListener('click', () => {
        const msg = f.querySelector('.msg-error');
        const r1 = alForm.leer(); if (r1.error) { msg.textContent = r1.error; msg.hidden = false; return; }
        const r2 = adForm.leer(); if (r2.error) { msg.textContent = r2.error; msg.hidden = false; return; }
        const ad = f.querySelector('.selAd').value;
        const filaAdulto = ad === 'otro' ? { tipo_miembro: 'invitado', ...r2.datos } : { tipo_miembro: 'adulto', adulto_id: ad, ...r2.datos };
        guardar([{ tipo_miembro: 'alumno', alumno_id: f.querySelector('.selAl').value, ...r1.datos }, filaAdulto], msg);
      });
      zona.appendChild(f);
    });

    const btnSolo = acciones.querySelector('.soloAdulto');
    if (btnSolo) btnSolo.addEventListener('click', () => {
      zona.innerHTML = '';
      const f = document.createElement('div');
      f.className = 'mini-form';
      f.innerHTML = `<div class="field"><label>Adulto</label><select class="selAd">${adultosLibres.map(a => `<option value="${a.id}">${esc(nombreCompleto(a))}</option>`).join('')}</select></div>
        <div class="adDatos"></div>
        <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;"><button type="button" class="btn btn-primary ok">Apuntar</button><button type="button" class="linklike cancel">Cancelar</button></div>
        <p class="msg-error" hidden></p>`;
      const adForm = camposPersona(evento, 'adulto');
      if (!adForm.vacio) f.querySelector('.adDatos').appendChild(adForm);
      f.querySelector('.cancel').addEventListener('click', () => { zona.innerHTML = ''; });
      f.querySelector('.ok').addEventListener('click', () => {
        const msg = f.querySelector('.msg-error');
        const r = adForm.leer(); if (r.error) { msg.textContent = r.error; msg.hidden = false; return; }
        guardar([{ tipo_miembro: 'adulto', adulto_id: f.querySelector('.selAd').value, ...r.datos }], msg);
      });
      zona.appendChild(f);
    });
  }
  card.appendChild(b);

  const docs = await bloqueDocumentos(evento, ins);
  if (docs) card.appendChild(docs);
  return card;
}

// Lector de Word (solo se descarga si alguien sube un .docx)
function cargarMammoth() {
  return cargarScript('https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js', 'mammoth');
}

function cargarScript(url, global) {
  if (window[global]) return Promise.resolve();
  return new Promise((ok, ko) => {
    const sc = document.createElement('script');
    sc.src = url; sc.onload = ok; sc.onerror = () => ko(new Error('No se pudo leer el Word. Inténtalo de nuevo.'));
    document.head.appendChild(sc);
  });
}
// Datos internos del Word (sin el nombre del autor, para no romper el
// anonimato): fechas, minutos de edición, veces guardado, palabras, programa.
async function metadatosWord(file) {
  try {
    await cargarScript('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js', 'JSZip');
    const zip = await JSZip.loadAsync(await file.arrayBuffer());
    const leer = async (ruta) => { const f = zip.file(ruta); return f ? new DOMParser().parseFromString(await f.async('string'), 'application/xml') : null; };
    const core = await leer('docProps/core.xml'), app = await leer('docProps/app.xml');
    const v = (doc, tag) => { if (!doc) return null; const el = doc.getElementsByTagName(tag)[0]; return el ? el.textContent.trim() : null; };
    const n = (x) => x == null || x === '' || isNaN(Number(x)) ? null : Number(x);
    return {
      origen: 'word',
      creado: v(core, 'dcterms:created'), modificado: v(core, 'dcterms:modified'),
      revisiones: n(v(core, 'cp:revision')), minutos_edicion: n(v(app, 'TotalTime')),
      palabras_word: n(v(app, 'Words')), programa: v(app, 'Application')
    };
  } catch (e) { return { origen: 'word', error: 'No se pudieron leer los datos del archivo' }; }
}

/* ==================== Concurso literario (un texto por alumno, anónimo) ==================== */
async function renderEventoConcurso(evento) {
  const card = cabeceraEvento(evento);
  const elegibles = miembrosElegiblesEvento(evento);
  const { data: misEnvios } = await sb.from('concurso_identidades')
    .select('alumno_id, concurso_envios(evento_id, es_ganador)').eq('socio_id', ctxGlobal.socio.id);
  const enviosDeEsteEvento = (misEnvios || []).filter(i => i.concurso_envios && i.concurso_envios.evento_id === evento.id);
  const gate = estadoInscripcionSocio(evento);
  card.dataset.abierto = gate.abierta ? '1' : '';
  card.dataset.apuntado = enviosDeEsteEvento.length ? '1' : '';

  const b = document.createElement('div');
  b.className = 'bloque';
  b.innerHTML = '<h3>Un texto por alumno</h3><p class="ayuda">Mejor en Word (.docx), para poder montar el libro. El jurado no sabe de quién es cada texto hasta elegir al ganador.</p>';
  elegibles.alumnos.forEach(alumno => {
    const envio = enviosDeEsteEvento.find(i => i.alumno_id === alumno.id);
    const fila = document.createElement('div');
    fila.className = 'miembro';
    fila.innerHTML = `<div class="miembro-fila"><span>${esc(nombreCompleto(alumno))}</span><span class="accion"></span></div>`;
    const accion = fila.querySelector('.accion');
    if (envio) accion.innerHTML = `<span class="estado-ok">Enviado${envio.concurso_envios.es_ganador ? '. ¡Ha ganado!' : ''}</span>`;
    else if (!gate.abierta) accion.innerHTML = '<span class="estado-gris">Plazo cerrado</span>';
    else {
      const btn = document.createElement('button'); btn.className = 'btn btn-outline'; btn.textContent = 'Escribir texto';
      btn.addEventListener('click', () => {
        const z = document.createElement('div');
        z.className = 'mini-form';
        z.innerHTML = `<p style="margin:0; font-weight:700;">Texto de ${esc(alumno.nombre)}</p>
          <div class="field"><label>Sube el documento de Word (.docx)</label><input type="file" class="word" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document"></div>
          <details><summary>O escríbelo aquí</summary><textarea rows="10" style="margin-top:8px;"></textarea></details>
          <div style="display:flex; gap:12px; align-items:center;"><button type="button" class="btn btn-primary">Enviar</button><button type="button" class="linklike">Cancelar</button></div><p class="msg-error" hidden></p>`;
        btn.hidden = true;
        // Cómo se escribe en la web: tiempo y texto pegado (orientativo para el jurado)
        const escritura = { inicio: null, ultimo: null, pegado: 0 };
        const ta = z.querySelector('textarea');
        ta.addEventListener('input', () => { const t = Date.now(); escritura.inicio = escritura.inicio || t; escritura.ultimo = t; });
        ta.addEventListener('paste', (e) => { escritura.pegado += ((e.clipboardData && e.clipboardData.getData('text')) || '').length; });
        z.querySelector('.linklike').addEventListener('click', () => { z.remove(); btn.hidden = false; });
        z.querySelector('.btn-primary').addEventListener('click', async () => {
          const msg = z.querySelector('.msg-error');
          const enviarBtn = z.querySelector('.btn-primary');
          const file = z.querySelector('.word').files[0];
          let texto = z.querySelector('textarea').value.trim();
          let ruta = null;
          let metadatos = file ? null : {
            origen: 'web', caracteres: texto.length, caracteres_pegados: escritura.pegado,
            minutos_escribiendo: escritura.inicio ? Math.round((escritura.ultimo - escritura.inicio) / 6000) / 10 : 0
          };
          if (!file && !texto) { msg.textContent = 'Sube el Word o escribe el texto.'; msg.hidden = false; return; }
          if (file && !/\.docx$/i.test(file.name)) { msg.textContent = 'Tiene que ser un documento de Word (.docx). Si lo tienes en .doc, guárdalo como .docx.'; msg.hidden = false; return; }
          if (!confirm('Una vez enviado no se puede cambiar. ¿Lo enviamos?')) return;
          enviarBtn.disabled = true; enviarBtn.textContent = 'Enviando...';
          try {
            if (file) {
              await cargarMammoth();
              const r = await mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
              metadatos = await metadatosWord(file);
              texto = (r.value || '').trim();
              if (!texto) throw new Error('El documento parece vacío.');
              // Nombre al azar: el archivo no dice de qué familia es
              ruta = `${evento.id}/${crypto.randomUUID()}.docx`;
              const { error: upErr } = await sb.storage.from('concursos').upload(ruta, file, { contentType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
              if (upErr) throw new Error('No se pudo subir el documento: ' + upErr.message);
            }
            const { error } = await sb.rpc('concurso_enviar_texto', { p_evento_id: evento.id, p_texto: texto, p_alumno_id: alumno.id, p_archivo_path: ruta, p_metadatos: metadatos });
            if (error) throw error;
            repintar(card, evento);
          } catch (err) {
            msg.textContent = textoError(err); msg.hidden = false;
            enviarBtn.disabled = false; enviarBtn.textContent = 'Enviar';
          }
        });
        fila.appendChild(z);
      });
      accion.appendChild(btn);
    }
    b.appendChild(fila);
  });
  card.appendChild(b);
  return card;
}

(async () => {
  const ctx = await requireAuth();
  if (!ctx) return;
  ctxGlobal = ctx;
  renderNav('eventos', ctx);
  const [{ data: adultosData }, { data: alumnosData }] = await Promise.all([
    sb.from('adultos').select('*').eq('socio_id', ctx.socio.id),
    sb.from('alumnos').select('*').eq('socio_id', ctx.socio.id)
  ]);
  misAdultos = adultosData || [];
  misAlumnos = alumnosData || [];
  await cargarEventos();
})();
